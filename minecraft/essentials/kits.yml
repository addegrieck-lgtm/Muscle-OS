# Kits EssentialsX de VÆLORIA — à copier dans plugins/Essentials/kits.yml, puis /essentials reload.
# Valeurs au prix d'achat de VæloriaShop (shop.yml). Presque rien n'y est revendable au marché :
# les kits n'injectent pas d'argent dans l'économie.
kits:
  # Donné une seule fois, à la toute première connexion (newbies.kit dans config.yml). ≈ 3 500 $
  depart:
    delay: -1
    items:
      - stone_sword 1
      - stone_pickaxe 1
      - stone_axe 1
      - stone_shovel 1
      - /shop admin give {player} houe_moisson_1 1
      - wheat_seeds 32
      - carrot 16
      - potato 16
      - bone_meal 16
      - cooked_beef 32
      - oak_log 32
      - torch 32
      - crafting_table 1
      - furnace 1
      - chest 2
  # Grade gratuit Joueur : /kit joueur, toutes les 24 h. ≈ 300 $ + outils en pierre
  joueur:
    delay: 86400
    items:
      - stone_sword 1
      - stone_pickaxe 1
      - stone_axe 1
      - stone_shovel 1
      - cooked_beef 16
      - torch 16
      - wheat_seeds 16
      - bone_meal 8

  # ── Grades payants : /kit <grade>, une fois par semaine ─────────────
  # Chaque grade hérite des précédents : un VÆLORIAN peut aussi prendre les kits Guerrier, Seigneur et Roi.
  guerrier:
    delay: 604800
    items:
      - chainmail_helmet 1
      - chainmail_chestplate 1
      - chainmail_leggings 1
      - chainmail_boots 1
      - iron_sword 1
      - iron_pickaxe 1
      - golden_carrot 16
  seigneur:
    delay: 604800
    items:
      - iron_helmet 1
      - iron_chestplate 1
      - iron_leggings 1
      - iron_boots 1
      - iron_sword 1
      - iron_pickaxe 1
      - iron_axe 1
      - bow 1
      - arrow 16
      - golden_apple 1
      - golden_carrot 16
  roi:
    delay: 604800
    items:
      - diamond_helmet 1
      - iron_chestplate 1
      - iron_leggings 1
      - diamond_boots 1
      - diamond_sword 1
      - iron_pickaxe 1
      - iron_axe 1
      - bow 1
      - arrow 32
      - golden_apple 2
      - golden_carrot 32
  # Le plus haut grade : full diamant, sans aucun enchantement.
  vaelorian:
    delay: 604800
    items:
      - diamond_helmet 1
      - diamond_chestplate 1
      - diamond_leggings 1
      - diamond_boots 1
      - diamond_sword 1
      - diamond_pickaxe 1
      - diamond_axe 1
      - bow 1
      - arrow 32
      - golden_apple 4
      - golden_carrot 32
