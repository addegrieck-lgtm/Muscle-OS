# Kits EssentialsX de VÆLORIA — à copier dans plugins/Essentials/kits.yml, puis /essentials reload.
# Valeurs au prix d'achat de VæloriaShop (shop.yml). Presque rien n'y est revendable au marché :
# les kits n'injectent pas d'argent dans l'économie.
kits:
  # Donné une seule fois, à la toute première connexion (newbies.kit dans config.yml). ≈ 3 500 $
  depart:
    delay: -1
    items:
      - stone_sword 1
      - stone_pickaxe 1
      - stone_axe 1
      - stone_shovel 1
      - /shop admin give {player} houe_moisson_1 1
      - wheat_seeds 32
      - carrot 16
      - potato 16
      - bone_meal 16
      - cooked_beef 32
      - oak_log 32
      - torch 32
      - crafting_table 1
      - furnace 1
      - chest 2
  # Grade gratuit Joueur : /kit joueur, toutes les 24 h. ≈ 300 $ + outils en pierre
  joueur:
    delay: 86400
    items:
      - stone_sword 1
      - stone_pickaxe 1
      - stone_axe 1
      - stone_shovel 1
      - cooked_beef 16
      - torch 16
      - wheat_seeds 16
      - bone_meal 8
