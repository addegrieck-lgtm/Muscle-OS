<div style="background:#F1ECE4;padding:40px 16px;font-family:Georgia,'Times New Roman',serif;color:#44372E">
  <div style="max-width:520px;margin:0 auto;background:#FBF8F3;padding:40px 32px;text-align:center">
    <p style="letter-spacing:6px;font-size:18px;margin:0 0 32px">LUMÉANCE</p>
    <h1 style="font-weight:normal;font-size:26px;margin:0 0 16px">Bienvenue dans la maison</h1>

    </p>
    <a href="{{ .SiteURL }}/compte/confirmation?token_hash={{ .TokenHash }}&type=email"

    </p>
  </div>
</div>
