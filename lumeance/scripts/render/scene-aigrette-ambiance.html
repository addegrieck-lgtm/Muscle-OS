<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Visualisation d'Aigrette d'après les photos du fabricant : cœur métallique d'où rayonnent des
// tiges fines, chacune terminée par une petite ramure portant des perles de cristal ; ampoules G9
// LED en capsule autour du cœur. Rond : boule de Ø w, câble unique vers un pavillon rond.
// Linéaire : barre horizontale de longueur w, hauteur 40 cm, deux câbles vers un pavillon de 50 cm.
// Paramètres : form (round | bar), w (cm), bulbs, finish (dore | chrome), temp (chaud | neutre | froid), seed.
// Variante « ambiance » (photos de présentation) : salon sombre pour la version ronde, salle à
// manger pour la version linéaire. Le luminaire est STRICTEMENT le même modèle que scene-aigrette.html.
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

const t0 = performance.now();
const q = new URLSearchParams(location.search);
const form = q.get("form") || "round";
const W = Number(q.get("w") || 50) / 100;
const BULBS = Number(q.get("bulbs") || 9);
const FINISH = q.get("finish") || "dore";
const TEMP = q.get("temp") || "chaud";
const seed = Number(q.get("seed") || 7);
const SCALE = 2, WIDTH = 1600, HEIGHT = 2000;

const METAL = {
  dore: { color: 0xd6b26e, metalness: 1, roughness: 0.26 },
  chrome: { color: 0xe4e6ea, metalness: 1, roughness: 0.08 },
}[FINISH];
const LIGHT = { chaud: 0xffc283, neutre: 0xfff0dc, froid: 0xe4eeff }[TEMP];
const GLOW = { chaud: 0xffe2b8, neutre: 0xfff8ee, froid: 0xf2f7ff }[TEMP];

let s = seed >>> 0;
const rand = () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(WIDTH, HEIGHT); renderer.setPixelRatio(SCALE);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

// ── Luminaire ──
const metal = new THREE.MeshStandardMaterial(METAL);
const cableMat = new THREE.MeshStandardMaterial({ color: 0xd0d0d0, metalness: 0.8, roughness: 0.3 });
const crystalMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.02, transparent: true, opacity: 0.72, envMapIntensity: 3.2, emissive: GLOW, emissiveIntensity: 0.035, clearcoat: 1, side: THREE.DoubleSide });
const bulbMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: GLOW, emissiveIntensity: Math.min(1, 9 / BULBS), roughness: 0.4 });
const Y0 = form === "round" ? -0.55 - W / 2 : -1.02; // centre du luminaire sous le plafond
const group = new THREE.Group(); scene.add(group);

// Tiges et cristaux en instances (des milliers d'éléments).
const rods = [], gems = [];
const UP = new THREE.Vector3(0, 1, 0);
function rodTo(a, b, r) { rods.push([a.clone(), b.clone(), r]); }
function rod(a, b, r, mat) {
  const d = new THREE.Vector3().subVectors(b, a); const len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), mat);
  m.position.copy(a).addScaledVector(d, 0.5); m.quaternion.setFromUnitVectors(UP, d.normalize()); group.add(m); return m;
}
const randDir = () => { const u = rand() * 2 - 1, a = rand() * Math.PI * 2, r = Math.sqrt(1 - u * u); return new THREE.Vector3(r * Math.cos(a), u, r * Math.sin(a)); };
// Ramure terminale : 3 à 4 brindilles courtes, chacune avec 1 à 2 perles de cristal.
function sprig(at, dir, size) {
  const n = 3 + Math.floor(rand() * 2);
  for (let i = 0; i < n; i++) {
    const d = dir.clone().add(randDir().multiplyScalar(0.9)).normalize();
    const e = at.clone().addScaledVector(d, size * (0.5 + rand() * 0.6));
    rodTo(at, e, 0.0007);
    gems.push([e, 0.0038 + rand() * 0.0025]);
    if (rand() < 0.35) gems.push([at.clone().lerp(e, 0.55), 0.003 + rand() * 0.0015]);
  }
}

let bulbAnchors = [];
if (form === "round") {
  const R = W / 2;
  const center = new THREE.Vector3(0, Y0, 0);
  const core = new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.035, R * 0.12), 32, 24), metal);
  core.position.copy(center); group.add(core);
  // Tige de suspension, manchon, câble vers le pavillon.
  const top = center.clone().add(new THREE.Vector3(0, R * 0.12 + 0.05, 0));
  rod(center, top, 0.006, metal);
  rod(top, new THREE.Vector3(0, -0.04, 0), 0.0012, cableMat);
  const canopy = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.035, 48), metal);
  canopy.position.y = -0.0175; group.add(canopy);
  const n = Math.round(150 * R / 0.25);
  for (let i = 0; i < n; i++) {
    // Distribution de Fibonacci (couverture régulière) avec un léger aléa.
    const k = (i + 0.5) / n, phi = Math.acos(1 - 2 * k), th = Math.PI * (1 + Math.sqrt(5)) * i;
    const d = new THREE.Vector3(Math.sin(phi) * Math.cos(th), Math.cos(phi), Math.sin(phi) * Math.sin(th)).add(randDir().multiplyScalar(0.12)).normalize();
    if (d.y > 0.9) continue; // la tige de suspension
    const len = R * (0.78 + rand() * 0.18);
    const end = center.clone().addScaledVector(d, len);
    rodTo(center.clone().addScaledVector(d, R * 0.1), end, 0.0011);
    sprig(end, d, R * 0.12);
  }
  for (let i = 0; i < BULBS; i++) {
    const k = (i + 0.5) / BULBS, phi = Math.acos(1 - 2 * k), th = Math.PI * (1 + Math.sqrt(5)) * i + 0.3;
    bulbAnchors.push([center, new THREE.Vector3(Math.sin(phi) * Math.cos(th), Math.cos(phi) * 0.85, Math.sin(phi) * Math.sin(th)).normalize(), R * 0.28]);
  }
} else {
  const L = W, H = 0.4, D = 0.34;
  const a = new THREE.Vector3(-L * 0.42, Y0, 0), b = new THREE.Vector3(L * 0.42, Y0, 0);
  rod(a, b, 0.008, metal);
  const plate = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.028, 0.07), metal);
  plate.position.y = -0.014; group.add(plate);
  [-0.2, 0.2].forEach((x) => rod(new THREE.Vector3(x * L / 0.72 * 0.6, Y0, 0), new THREE.Vector3(x, -0.03, 0), 0.0011, cableMat));
  const n = Math.round(190 * L / 0.72);
  for (let i = 0; i < n; i++) {
    const x = (rand() - 0.5) * L * 0.84;
    const origin = new THREE.Vector3(x, Y0, 0);
    const d = randDir(); d.x *= 0.35; d.normalize();
    // Enveloppe : ellipsoïde L × H × D (les tiges des extrémités s'allongent vers l'extérieur).
    const len = Math.min(H / 2 / Math.max(Math.abs(d.y), 0.2), D / 2 / Math.max(Math.abs(d.z), 0.2), 0.24) * (0.75 + rand() * 0.25);
    const end = origin.clone().addScaledVector(d, len);
    if (Math.abs(end.x) > L / 2) continue;
    rodTo(origin, end, 0.001);
    sprig(end, d, 0.035);
  }
  for (let i = 0; i < BULBS; i++) {
    const x = -L * 0.38 + (i / Math.max(1, BULBS - 1)) * L * 0.76;
    bulbAnchors.push([new THREE.Vector3(x, Y0, 0), new THREE.Vector3(0, i % 2 ? 1 : -1, (i % 3 - 1) * 0.6).normalize(), 0.035]);
  }
}
// Ampoules G9 LED en capsule, au bout d'une courte douille.
for (const [c, d, r] of bulbAnchors) {
  const base = c.clone().addScaledVector(d, r);
  rod(c, base, 0.004, metal);
  const sock = base.clone().addScaledVector(d, 0.012);
  rod(base, sock, 0.007, metal);
  const g = new THREE.Mesh(new THREE.CapsuleGeometry(0.0085, 0.03, 6, 16), bulbMat);
  g.position.copy(sock).addScaledVector(d, 0.024); g.quaternion.setFromUnitVectors(UP, d); group.add(g);
  const pl = new THREE.PointLight(LIGHT, 0.09, 4, 2); pl.position.copy(g.position); scene.add(pl);
}
// Instanciation des tiges et des cristaux.
const rodGeo = new THREE.CylinderGeometry(1, 1, 1, 5);
const rodsMesh = new THREE.InstancedMesh(rodGeo, metal, rods.length);
const m4 = new THREE.Matrix4(), qt = new THREE.Quaternion(), v = new THREE.Vector3(), sc = new THREE.Vector3();
rods.forEach(([a, b, r], i) => {
  const d = new THREE.Vector3().subVectors(b, a); const len = d.length();
  qt.setFromUnitVectors(UP, d.normalize()); v.copy(a).lerp(b, 0.5); sc.set(r, len, r);
  rodsMesh.setMatrixAt(i, m4.compose(v, qt, sc));
});
group.add(rodsMesh);
const gemGeo = new THREE.OctahedronGeometry(1, 0);
const gemsMesh = new THREE.InstancedMesh(gemGeo, crystalMat, gems.length);
gems.forEach(([p, r], i) => {
  qt.setFromEuler(new THREE.Euler(rand() * 3, rand() * 3, rand() * 3)); sc.set(r, r * 1.5, r);
  gemsMesh.setMatrixAt(i, m4.compose(p, qt, sc));
});
group.add(gemsMesh);
group.rotation.y = (rand() - 0.5) * 0.4;

// ── Décor (après le luminaire : son tirage aléatoire reste identique à scene-aigrette.html) ──
function canvasTex(size, draw, rx = 1, ry = 1) {
  const c = document.createElement("canvas"); c.width = c.height = size; draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
// Enduit lisse : grain très fin et nuances douces (pas de mouchetis visible).
const plaster = (base, rx = 3, ry = 3) => canvasTex(1024, (x, S) => {
  x.fillStyle = base; x.fillRect(0, 0, S, S);
  for (let i = 0; i < 60; i++) { const cx = rand() * S, cy = rand() * S; const g = x.createRadialGradient(cx, cy, 0, cx, cy, 80 + rand() * 260); const a = rand() < 0.5 ? "255,250,240" : "0,0,0"; g.addColorStop(0, `rgba(${a},0.025)`); g.addColorStop(1, `rgba(${a},0)`); x.fillStyle = g; x.fillRect(0, 0, S, S); }
  for (let i = 0; i < 90000; i++) { const v = rand() < 0.5 ? 255 : 0; x.fillStyle = `rgba(${v},${v},${v},0.012)`; x.fillRect(rand() * S, rand() * S, 1.2, 1.2); }
}, rx, ry);
const mat = (o) => new THREE.MeshStandardMaterial(o);
const box = (w, h, d, m, x, y, z) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); scene.add(b); return b; };
const ROOM = form === "round" ? "salon" : "salle";
const FLOOR_Y = -2.6;

if (ROOM === "salon") {
  // Salon : plafond clair à gorge lumineuse, mur anthracite chaud, rideau de lin, tableau encadré.
  const ceilM = mat({ map: plaster("#e4ddd2"), roughness: 0.92 });
  box(10, 0.02, 10, ceilM, 0, 0.01, 0);
  const wallM = mat({ map: plaster("#3b3836", 3, 2), roughness: 0.9 });
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(10, 3), wallM); wall.position.set(0, -1.3, -1.8); scene.add(wall);
  const side = new THREE.Mesh(new THREE.PlaneGeometry(10, 3), mat({ map: plaster("#4a4542", 3, 2), roughness: 0.9 }));
  side.rotation.y = Math.PI / 2; side.position.set(-2.4, -1.3, 0); scene.add(side);
  box(10, 0.02, 10, mat({ color: 0x2b2420, roughness: 0.6 }), 0, FLOOR_Y, 0);
  // Spot encastré : halo doux sur le mur, au-dessus du tableau.
  const wash = new THREE.SpotLight(0xffd9a8, 4, 5, 0.5, 0.95, 1.4); wash.position.set(1.0, -0.05, -1.35); wash.target.position.set(1.0, -1.6, -1.8); scene.add(wash, wash.target);
  const dl = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.005, 32), new THREE.MeshBasicMaterial({ color: 0xfff1dc })); dl.position.set(1.0, -0.002, -1.35); scene.add(dl);
  // Rideau de lin à plis (géométrie ondulée), à gauche, devant une fenêtre claire.
  const curtGeo = new THREE.PlaneGeometry(0.85, 2.6, 160, 1);
  const p = curtGeo.attributes.position; for (let i = 0; i < p.count; i++) { const xx = p.getX(i); p.setZ(i, Math.sin(xx * 38) * 0.03 + Math.sin(xx * 13 + 1) * 0.02); }
  curtGeo.computeVertexNormals();
  const linen = canvasTex(512, (x, S) => { x.fillStyle = "#8c7f72"; x.fillRect(0, 0, S, S); for (let i = 0; i < S; i += 2) { x.fillStyle = `rgba(255,245,230,${0.03 + rand() * 0.04})`; x.fillRect(0, i, S, 1); x.fillRect(i, 0, 1, S); } }, 2, 4);
  const curtain = new THREE.Mesh(curtGeo, mat({ map: linen, roughness: 1, side: THREE.DoubleSide }));
  curtain.position.set(-1.2, -1.32, -1.62); scene.add(curtain);
  const sheer = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 2.6), new THREE.MeshBasicMaterial({ color: 0xd9d2c8 }));
  sheer.position.set(-1.95, -1.32, -1.75); scene.add(sheer);
  // Tableau : passe-partout ivoire, cadre doré, gerbe de traits rayonnants (écho au luminaire).
  const art = canvasTex(1024, (x, S) => {
    x.fillStyle = "#ece6dc"; x.fillRect(0, 0, S, S);
    x.translate(S / 2, S / 2);
    for (let i = 0; i < 520; i++) { const a = (i / 520) * Math.PI * 2, r0 = 40 + rand() * 40, r1 = 300 + rand() * 140; if (Math.abs(Math.cos(a)) < 0.12) continue; x.strokeStyle = `rgba(${150 + rand() * 40},${115 + rand() * 30},${60 + rand() * 30},${0.35 + rand() * 0.4})`; x.lineWidth = 0.8 + rand() * 1.2; x.beginPath(); x.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); x.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); x.stroke(); }
  });
  box(0.8, 1.02, 0.035, mat({ color: 0xc9a45c, metalness: 1, roughness: 0.3 }), 1.05, -1.5, -1.77);
  const canvasArt = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 0.97), mat({ map: art, roughness: 0.85 })); canvasArt.position.set(1.05, -1.5, -1.75); scene.add(canvasArt);
  scene.add(new THREE.HemisphereLight({ chaud: 0xffe6c6, neutre: 0xfff6ea, froid: 0xeef2ff }[TEMP], 0x1d1814, 0.35));
  const fill = new THREE.DirectionalLight(0xdfe6f0, 0.35); fill.position.set(-3, -1, 1.5); scene.add(fill); // jour par la fenêtre
} else {
  // Salle à manger : murs grège, table en chêne, coupe de fruits, vase de verre et branches.
  const ceilM = mat({ map: plaster("#e9e4dc"), roughness: 0.92 });
  box(10, 0.02, 10, ceilM, 0, 0.01, 0);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(10, 3), mat({ map: plaster("#b9aea2", 3, 2), roughness: 0.9 })); wall.position.set(0, -1.3, -2.2); scene.add(wall);
  const side = new THREE.Mesh(new THREE.PlaneGeometry(10, 3), mat({ map: plaster("#c6bcb1", 3, 2), roughness: 0.9 }));
  side.rotation.y = Math.PI / 2; side.position.set(-2.6, -1.3, 0); scene.add(side);
  box(10, 0.02, 10, mat({ color: 0x8d7a66, roughness: 0.55 }), 0, FLOOR_Y, 0);
  const oak = canvasTex(1024, (x, S) => {
    x.fillStyle = "#9a7652"; x.fillRect(0, 0, S, S);
    for (let y = 0; y < S; y += 1) { const n = Math.sin(y * 0.05 + Math.sin(y * 0.013) * 4) * 0.5 + 0.5; x.fillStyle = `rgba(${70 + n * 60},${48 + n * 40},${28 + n * 22},${0.12 + rand() * 0.08})`; x.fillRect(0, y, S, 1); }
    for (let i = 0; i < 400; i++) { x.fillStyle = `rgba(30,18,10,${rand() * 0.15})`; x.fillRect(rand() * S, rand() * S, 40 + rand() * 200, 1); }
  }, 1, 1);
  const TOP_Y = FLOOR_Y + 0.76;
  box(2.2, 0.045, 0.95, mat({ map: oak, roughness: 0.5, metalness: 0 }), 0, TOP_Y - 0.0225, -0.05);
  [[-0.98, -0.44], [0.98, -0.44], [-0.98, 0.34], [0.98, 0.34]].forEach(([lx, lz]) => box(0.07, 0.71, 0.07, mat({ map: oak, roughness: 0.5 }), lx, FLOOR_Y + 0.355, lz));
  // Mise en table sobre : chemin de lin, coupe en céramique mate, deux bougeoirs en laiton.
  const runner = canvasTex(512, (x, S) => { x.fillStyle = "#c9bfb1"; x.fillRect(0, 0, S, S); for (let i = 0; i < S; i += 2) { x.fillStyle = `rgba(90,70,50,${0.03 + rand() * 0.04})`; x.fillRect(0, i, S, 1); x.fillRect(i, 0, 1, S); } }, 6, 1);
  box(1.7, 0.004, 0.36, mat({ map: runner, roughness: 1 }), 0, TOP_Y + 0.002, -0.05);
  const bowl = new THREE.Mesh(new THREE.LatheGeometry([[0, 0], [0.07, 0], [0.075, 0.012], [0.12, 0.03], [0.17, 0.055], [0.2, 0.072], [0.205, 0.08], [0.198, 0.08], [0.165, 0.062], [0.11, 0.04], [0, 0.03]].map(([r, y]) => new THREE.Vector2(r, y)), 96), mat({ color: 0x3a3632, roughness: 0.7, side: THREE.DoubleSide }));
  bowl.position.set(-0.05, TOP_Y + 0.004, -0.05); scene.add(bowl);
  const brass = mat({ color: 0xc9a45c, metalness: 1, roughness: 0.25 });
  [[-0.55, 0.26], [0.5, 0.2]].forEach(([cx, h]) => {
    const stem = new THREE.Mesh(new THREE.LatheGeometry([[0.045, 0], [0.045, 0.01], [0.012, 0.03], [0.01, h - 0.03], [0.022, h - 0.01], [0.022, h]].map(([r, y]) => new THREE.Vector2(r, y)), 48), brass);
    stem.position.set(cx, TOP_Y + 0.004, -0.05); scene.add(stem);
    const candle = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.22, 24), mat({ color: 0xf1ebe0, roughness: 0.7 }));
    candle.position.set(cx, TOP_Y + 0.004 + h + 0.11, -0.05); scene.add(candle);
  });
  // Lumière du luminaire sur la table (cône chaud) et jour diffus par la gauche.
  const pool = new THREE.SpotLight(LIGHT, 1.6, 3, 0.85, 0.9, 1.2); pool.position.set(0, -1.0, 0); pool.target.position.set(0, TOP_Y, 0); scene.add(pool, pool.target);
  scene.add(new THREE.HemisphereLight(0xfff4e6, 0x6b5a48, 0.5));
  const day = new THREE.DirectionalLight(0xf3f0ea, 0.9); day.position.set(-3, -0.5, 1.5); scene.add(day);
}

// ── Caméra ──
const camera = new THREE.PerspectiveCamera(34, WIDTH / HEIGHT, 0.02, 50);
if (form === "round") {
  // Salon : la boule au tiers supérieur, le tableau en contrepoint à droite, le rideau à gauche.
  camera.position.set(0.3, -1.5, 3.7);
  camera.lookAt(0.22, -1.08, 0);
} else {
  // Salle à manger : vue légèrement plongeante, luminaire au tiers supérieur, table en bas.
  camera.position.set(0.45, -0.95, 4.3);
  camera.lookAt(0.05, -1.22, 0);
}

const composer = new EffectComposer(renderer);
composer.setPixelRatio(SCALE); composer.setSize(WIDTH, HEIGHT);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(WIDTH * SCALE, HEIGHT * SCALE), 0.3, 0.22, 0.92));
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null }, seed: { value: seed * 0.37 } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
  fragmentShader: "uniform sampler2D tDiffuse; uniform float seed; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + seed)*43758.5453); } void main(){ vec4 c = texture2D(tDiffuse, vUv); float d = distance(vUv, vec2(.5,.45)); c.rgb *= mix(1., .8, smoothstep(.42,.95,d)); c.rgb += (h(vUv*1400.)-.5)*.006; gl_FragColor = c; }",
}));
composer.render();
window.__ms = performance.now() - t0;
window.__done = true;
</script></body></html>
