<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Visualisation d'Aigrette d'après les photos du fabricant : cœur métallique d'où rayonnent des
// tiges fines, chacune terminée par une petite ramure portant des perles de cristal ; ampoules G9
// LED en capsule autour du cœur. Rond : boule de Ø w, câble unique vers un pavillon rond.
// Linéaire : barre horizontale de longueur w, hauteur 40 cm, deux câbles vers un pavillon de 50 cm.
// Paramètres : form (round | bar), w (cm), bulbs, finish (dore | chrome), temp (chaud | neutre | froid), seed.
// Variante « ambiance » (photos de présentation) : salon sombre pour la version ronde, salle à
// manger pour la version linéaire. Le luminaire est STRICTEMENT le même modèle que scene-aigrette.html.
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { buildAigrette } from "/scripts/render/aigrette-model.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

const t0 = performance.now();
const q = new URLSearchParams(location.search);
const form = q.get("form") || "round";
const W = Number(q.get("w") || 50) / 100;
const BULBS = Number(q.get("bulbs") || 9);
const FINISH = q.get("finish") || "dore";
const TEMP = q.get("temp") || "chaud";
const seed = Number(q.get("seed") || 7);
const SCALE = 2, WIDTH = 1600, HEIGHT = 2000;

const METAL = {
  dore: { color: 0xd6b26e, metalness: 1, roughness: 0.26 },
  chrome: { color: 0xe4e6ea, metalness: 1, roughness: 0.08 },
}[FINISH];
const LIGHT = { chaud: 0xffc283, neutre: 0xfff0dc, froid: 0xe4eeff }[TEMP];
const GLOW = { chaud: 0xffe2b8, neutre: 0xfff8ee, froid: 0xf2f7ff }[TEMP];

let s = seed >>> 0;
const rand = () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(WIDTH, HEIGHT); renderer.setPixelRatio(SCALE);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

// ── Luminaire (modèle partagé : aigrette-model.js) ──
const { Y0 } = buildAigrette({ THREE, scene, rand, form, W, BULBS, METAL, LIGHT, GLOW, barY: -1.02 });
const UP = new THREE.Vector3(0, 1, 0);

// ── Décor (après le luminaire : son tirage aléatoire reste identique à scene-aigrette.html) ──
function canvasTex(size, draw, rx = 1, ry = 1) {
  const c = document.createElement("canvas"); c.width = c.height = size; draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
// Enduit lisse : grain très fin et nuances douces (pas de mouchetis visible).
const plaster = (base, rx = 3, ry = 3) => canvasTex(1024, (x, S) => {
  x.fillStyle = base; x.fillRect(0, 0, S, S);
  for (let i = 0; i < 60; i++) { const cx = rand() * S, cy = rand() * S; const g = x.createRadialGradient(cx, cy, 0, cx, cy, 80 + rand() * 260); const a = rand() < 0.5 ? "255,250,240" : "0,0,0"; g.addColorStop(0, `rgba(${a},0.025)`); g.addColorStop(1, `rgba(${a},0)`); x.fillStyle = g; x.fillRect(0, 0, S, S); }
  for (let i = 0; i < 90000; i++) { const v = rand() < 0.5 ? 255 : 0; x.fillStyle = `rgba(${v},${v},${v},0.012)`; x.fillRect(rand() * S, rand() * S, 1.2, 1.2); }
}, rx, ry);
const mat = (o) => new THREE.MeshStandardMaterial(o);
const box = (w, h, d, m, x, y, z) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); scene.add(b); return b; };
const ROOM = form === "round" ? "salon" : "salle";
const FLOOR_Y = -2.6;

if (ROOM === "salon") {
  // Salon : plafond clair à gorge lumineuse, mur anthracite chaud, rideau de lin, tableau encadré.
  const ceilM = mat({ map: plaster("#e4ddd2"), roughness: 0.92 });
  box(10, 0.02, 10, ceilM, 0, 0.01, 0);
  const wallM = mat({ map: plaster("#3b3836", 3, 2), roughness: 0.9 });
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(10, 3), wallM); wall.position.set(0, -1.3, -1.8); scene.add(wall);
  const side = new THREE.Mesh(new THREE.PlaneGeometry(10, 3), mat({ map: plaster("#4a4542", 3, 2), roughness: 0.9 }));
  side.rotation.y = Math.PI / 2; side.position.set(-2.4, -1.3, 0); scene.add(side);
  box(10, 0.02, 10, mat({ color: 0x2b2420, roughness: 0.6 }), 0, FLOOR_Y, 0);
  // Spot encastré : halo doux sur le mur, au-dessus du tableau.
  const wash = new THREE.SpotLight(0xffd9a8, 4, 5, 0.5, 0.95, 1.4); wash.position.set(1.0, -0.05, -1.35); wash.target.position.set(1.0, -1.6, -1.8); scene.add(wash, wash.target);
  const dl = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.005, 32), new THREE.MeshBasicMaterial({ color: 0xfff1dc })); dl.position.set(1.0, -0.002, -1.35); scene.add(dl);
  // Rideau de lin à plis (géométrie ondulée), à gauche, devant une fenêtre claire.
  const curtGeo = new THREE.PlaneGeometry(0.85, 2.6, 160, 1);
  const p = curtGeo.attributes.position; for (let i = 0; i < p.count; i++) { const xx = p.getX(i); p.setZ(i, Math.sin(xx * 38) * 0.03 + Math.sin(xx * 13 + 1) * 0.02); }
  curtGeo.computeVertexNormals();
  const linen = canvasTex(512, (x, S) => { x.fillStyle = "#8c7f72"; x.fillRect(0, 0, S, S); for (let i = 0; i < S; i += 2) { x.fillStyle = `rgba(255,245,230,${0.03 + rand() * 0.04})`; x.fillRect(0, i, S, 1); x.fillRect(i, 0, 1, S); } }, 2, 4);
  const curtain = new THREE.Mesh(curtGeo, mat({ map: linen, roughness: 1, side: THREE.DoubleSide }));
  curtain.position.set(-1.2, -1.32, -1.62); scene.add(curtain);
  const sheer = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 2.6), new THREE.MeshBasicMaterial({ color: 0xd9d2c8 }));
  sheer.position.set(-1.95, -1.32, -1.75); scene.add(sheer);
  // Tableau : passe-partout ivoire, cadre doré, gerbe de traits rayonnants (écho au luminaire).
  const art = canvasTex(1024, (x, S) => {
    x.fillStyle = "#ece6dc"; x.fillRect(0, 0, S, S);
    x.translate(S / 2, S / 2);
    for (let i = 0; i < 520; i++) { const a = (i / 520) * Math.PI * 2, r0 = 40 + rand() * 40, r1 = 300 + rand() * 140; if (Math.abs(Math.cos(a)) < 0.12) continue; x.strokeStyle = `rgba(${150 + rand() * 40},${115 + rand() * 30},${60 + rand() * 30},${0.35 + rand() * 0.4})`; x.lineWidth = 0.8 + rand() * 1.2; x.beginPath(); x.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); x.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); x.stroke(); }
  });
  box(0.8, 1.02, 0.035, mat({ color: 0xc9a45c, metalness: 1, roughness: 0.3 }), 1.05, -1.5, -1.77);
  const canvasArt = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 0.97), mat({ map: art, roughness: 0.85 })); canvasArt.position.set(1.05, -1.5, -1.75); scene.add(canvasArt);
  scene.add(new THREE.HemisphereLight({ chaud: 0xffe6c6, neutre: 0xfff6ea, froid: 0xeef2ff }[TEMP], 0x1d1814, 0.35));
  const fill = new THREE.DirectionalLight(0xdfe6f0, 0.35); fill.position.set(-3, -1, 1.5); scene.add(fill); // jour par la fenêtre
} else {
  // Salle à manger, dans l'esprit du salon : mur anthracite, lumière rasante, tableau encadré,
  // table en noyer avec chemin de lin, coupe, bougeoirs en laiton et vases en céramique mate.
  const ceilM = mat({ map: plaster("#e4ddd2"), roughness: 0.92 });
  box(10, 0.02, 10, ceilM, 0, 0.01, 0);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(10, 3), mat({ map: plaster("#3b3836", 3, 2), roughness: 0.9 })); wall.position.set(0, -1.3, -2.2); scene.add(wall);
  const side = new THREE.Mesh(new THREE.PlaneGeometry(10, 3), mat({ map: plaster("#4a4542", 3, 2), roughness: 0.9 }));
  side.rotation.y = Math.PI / 2; side.position.set(-2.6, -1.3, 0); scene.add(side);
  box(10, 0.02, 10, mat({ color: 0x2b2420, roughness: 0.55 }), 0, FLOOR_Y, 0);
  // Tableau : deux éventails de traits dorés (écho aux tiges du luminaire), passe-partout ivoire.
  const art = canvasTex(1024, (x, S) => {
    x.fillStyle = "#ece6dc"; x.fillRect(0, 0, S, S);
    for (const [cx, dir] of [[S * 0.47, -1], [S * 0.53, 1]]) {
      for (let i = 0; i < 260; i++) { const a = (rand() - 0.5) * Math.PI * 0.95, r = 220 + rand() * 170; x.strokeStyle = `rgba(${150 + rand() * 40},${115 + rand() * 30},${60 + rand() * 30},${0.3 + rand() * 0.45})`; x.lineWidth = 0.7 + rand(); x.beginPath(); x.moveTo(cx, S / 2); x.lineTo(cx + dir * Math.cos(a) * r, S / 2 + Math.sin(a) * r); x.stroke(); }
    }
  });
  box(0.84, 0.84, 0.035, mat({ color: 0xc9a45c, metalness: 1, roughness: 0.3 }), 1.25, -1.36, -2.17);
  const canvasArt = new THREE.Mesh(new THREE.PlaneGeometry(0.79, 0.79), mat({ map: art, roughness: 0.85 })); canvasArt.position.set(1.25, -1.36, -2.15); scene.add(canvasArt);
  const oak = canvasTex(1024, (x, S) => {
    x.fillStyle = "#6b4a30"; x.fillRect(0, 0, S, S);
    for (let y = 0; y < S; y += 1) { const n = Math.sin(y * 0.05 + Math.sin(y * 0.013) * 4) * 0.5 + 0.5; x.fillStyle = `rgba(${50 + n * 50},${32 + n * 34},${18 + n * 20},${0.14 + rand() * 0.08})`; x.fillRect(0, y, S, 1); }
    for (let i = 0; i < 400; i++) { x.fillStyle = `rgba(25,15,8,${rand() * 0.15})`; x.fillRect(rand() * S, rand() * S, 40 + rand() * 200, 1); }
  }, 1, 1);
  const TOP_Y = FLOOR_Y + 0.76;
  box(2.2, 0.05, 0.95, mat({ map: oak, roughness: 0.42, metalness: 0 }), 0, TOP_Y - 0.025, -0.05);
  [[-0.98, -0.44], [0.98, -0.44], [-0.98, 0.34], [0.98, 0.34]].forEach(([lx, lz]) => box(0.07, 0.71, 0.07, mat({ map: oak, roughness: 0.5 }), lx, FLOOR_Y + 0.355, lz));
  const runner = canvasTex(512, (x, S) => { x.fillStyle = "#c9bfb1"; x.fillRect(0, 0, S, S); for (let i = 0; i < S; i += 2) { x.fillStyle = `rgba(90,70,50,${0.03 + rand() * 0.04})`; x.fillRect(0, i, S, 1); x.fillRect(i, 0, 1, S); } }, 6, 1);
  box(1.7, 0.004, 0.36, mat({ map: runner, roughness: 1 }), 0, TOP_Y + 0.002, -0.05);
  const bowl = new THREE.Mesh(new THREE.LatheGeometry([[0, 0], [0.07, 0], [0.075, 0.012], [0.12, 0.03], [0.17, 0.055], [0.2, 0.072], [0.205, 0.08], [0.198, 0.08], [0.165, 0.062], [0.11, 0.04], [0, 0.03]].map(([r, y]) => new THREE.Vector2(r, y)), 96), mat({ color: 0x1f1d1b, roughness: 0.6, side: THREE.DoubleSide }));
  bowl.position.set(-0.12, TOP_Y + 0.004, -0.05); scene.add(bowl);
  const brass = mat({ color: 0xc9a45c, metalness: 1, roughness: 0.25 });
  [[-0.62, 0.26], [-0.48, 0.2]].forEach(([cx, h]) => {
    const stem = new THREE.Mesh(new THREE.LatheGeometry([[0.045, 0], [0.045, 0.01], [0.012, 0.03], [0.01, h - 0.03], [0.022, h - 0.01], [0.022, h]].map(([r, y]) => new THREE.Vector2(r, y)), 48), brass);
    stem.position.set(cx, TOP_Y + 0.004, -0.05); scene.add(stem);
    const candle = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.22, 24), mat({ color: 0xf1ebe0, roughness: 0.7 }));
    candle.position.set(cx, TOP_Y + 0.004 + h + 0.11, -0.05); scene.add(candle);
  });
  // Vases en céramique mate (sable et terre cuite), groupés à droite.
  const vase = (pts, color, x, z) => { const v = new THREE.Mesh(new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), 72), mat({ color, roughness: 0.85, side: THREE.DoubleSide })); v.position.set(x, TOP_Y + 0.004, z); scene.add(v); };
  vase([[0, 0], [0.06, 0], [0.09, 0.08], [0.1, 0.16], [0.085, 0.24], [0.04, 0.3], [0.035, 0.34], [0.04, 0.35], [0, 0.35]], 0xd8c8b0, 0.42, -0.12);
  vase([[0, 0], [0.05, 0], [0.075, 0.05], [0.08, 0.12], [0.06, 0.18], [0.03, 0.21], [0.032, 0.23], [0, 0.23]], 0xb4724e, 0.6, 0.02);
  vase([[0, 0], [0.045, 0], [0.06, 0.06], [0.055, 0.12], [0.03, 0.15], [0, 0.15]], 0x8b8178, 0.72, -0.15);
  // Lumière : cône chaud du luminaire sur la table, rasants sur le mur, jour discret à gauche.
  const pool = new THREE.SpotLight(LIGHT, 1.4, 3, 0.85, 0.9, 1.2); pool.position.set(0, -1.0, 0); pool.target.position.set(0, TOP_Y, 0); scene.add(pool, pool.target);
  [[-0.9, 3], [1.25, 4]].forEach(([wx, I]) => { const w = new THREE.SpotLight(0xffd9a8, I, 5, 0.5, 0.95, 1.4); w.position.set(wx, -0.05, -1.75); w.target.position.set(wx, -1.7, -2.2); scene.add(w, w.target); const dl = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.005, 32), new THREE.MeshBasicMaterial({ color: 0xfff1dc })); dl.position.set(wx, -0.002, -1.75); scene.add(dl); });
  scene.add(new THREE.HemisphereLight({ chaud: 0xffe6c6, neutre: 0xfff6ea, froid: 0xeef2ff }[TEMP], 0x1d1814, 0.4));
  const day = new THREE.DirectionalLight(0xdfe6f0, 0.45); day.position.set(-3, -0.5, 1.5); scene.add(day);
}

// ── Caméra ──
const camera = new THREE.PerspectiveCamera(34, WIDTH / HEIGHT, 0.02, 50);
if (form === "round") {
  // Salon : la boule au tiers supérieur, le tableau en contrepoint à droite, le rideau à gauche.
  camera.position.set(0.3, -1.5, 3.7);
  camera.lookAt(0.22, -1.08, 0);
} else {
  // Salle à manger : vue légèrement plongeante, luminaire au tiers supérieur, table en bas.
  camera.position.set(0.45, -0.95, 4.3);
  camera.lookAt(0.05, -1.22, 0);
}

const composer = new EffectComposer(renderer);
composer.setPixelRatio(SCALE); composer.setSize(WIDTH, HEIGHT);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(WIDTH * SCALE, HEIGHT * SCALE), 0.3, 0.22, 0.92));
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null }, seed: { value: seed * 0.37 } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
  fragmentShader: "uniform sampler2D tDiffuse; uniform float seed; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + seed)*43758.5453); } void main(){ vec4 c = texture2D(tDiffuse, vUv); float d = distance(vUv, vec2(.5,.45)); c.rgb *= mix(1., .8, smoothstep(.42,.95,d)); c.rgb += (h(vUv*1400.)-.5)*.006; gl_FragColor = c; }",
}));
composer.render();
window.__ms = performance.now() - t0;
window.__done = true;
</script></body></html>
