<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Visualisation de Lucie (LUM-LUS-009) — modèle : lucie-model.js.
// Paramètres : d (diamètre, m), h (hauteur totale, m), spots, temp (chaud | froid).
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { buildLucie, addCaustics } from "/scripts/render/lucie-model.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { buildRoom } from "/scripts/render/room.js";

const t0 = performance.now();
const q = new URLSearchParams(location.search);
const D = Number(q.get("d") || 0.6), H = Number(q.get("h") || 2.1), SPOTS = Number(q.get("spots") || 10);
const TEMP = q.get("temp") || "chaud";
const seed = 29 + Math.round(D * 100);
const SCALE = 2, WIDTH = 1200, HEIGHT = 1500;


// Lumière chaude ou froide (« warm / cool light » du fournisseur).
const LIGHT = { chaud: 0xffc283, froid: 0xe4eeff }[TEMP];
const GLOW = { chaud: 0xffe2b8, froid: 0xf2f7ff }[TEMP];
const ROOM_TEMP = TEMP;

let s = seed >>> 0;
const rand = () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(WIDTH, HEIGHT); renderer.setPixelRatio(SCALE);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.22;

// ── Pièce : salon clair (comme la cage d'escalier du fournisseur) : les anneaux fumés ressortent ──
buildRoom(scene, { rand, temp: ROOM_TEMP, theme: "salon", wallZ: -2.6 });
const keyL = new THREE.DirectionalLight({ chaud: 0xffe2c0, froid: 0xf2f5ff }[ROOM_TEMP], 0.28); keyL.position.set(2, -1, 3); scene.add(keyL);

// ── Luminaire : cascade sous le pavillon (câbles raccourcis pour le cadrage, réglables) ──
const LIGHT_N = new THREE.Color(LIGHT);
LIGHT_N.multiplyScalar(0.85 / (0.2126 * LIGHT_N.r + 0.7152 * LIGHT_N.g + 0.0722 * LIGHT_N.b));
const { bottom, sparkTex } = buildLucie({ THREE, scene, rand, D, H, spots: SPOTS, LIGHT: LIGHT_N, GLOW, topY: 0 });
addCaustics({ THREE, scene, rand, sparkTex, LIGHT: LIGHT_N, wallZ: -2.6, ceilY: 0, spanX: 4, spanY: 2.6, y0: -0.4 });

// ── Caméra : contre-plongée, pavillon et bas de la cascade dans le cadre ──
const camera = new THREE.PerspectiveCamera(36, WIDTH / HEIGHT, 0.02, 60);
const span = Math.max(-bottom + 0.35, (D + 0.9) * (HEIGHT / WIDTH));
const dist = span / (2 * Math.tan(THREE.MathUtils.degToRad(18)));
const lookY = bottom / 2 + 0.02;
camera.position.set(dist * 0.08, lookY - span * 0.12, dist * 0.98);
camera.lookAt(0, lookY, 0);

const composer = new EffectComposer(renderer);
composer.setPixelRatio(SCALE); composer.setSize(WIDTH, HEIGHT);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(WIDTH * SCALE, HEIGHT * SCALE), 0.14, 0.06, 0.985));
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null }, seed: { value: seed * 0.37 } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
  fragmentShader: "uniform sampler2D tDiffuse; uniform float seed; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + seed)*43758.5453); } void main(){ vec4 c = texture2D(tDiffuse, vUv); float d = distance(vUv, vec2(.5,.45)); c.rgb *= mix(1., .72, smoothstep(.38,.9,d)); c.rgb += (h(vUv*1400.)-.5)*.016; gl_FragColor = c; }",
}));
composer.render();
window.__ms = performance.now() - t0;
window.__done = true;
</script></body></html>
