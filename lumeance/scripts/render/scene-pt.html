<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{
"three":"/node_modules/three/build/three.module.js",
"three/addons/":"/node_modules/three/examples/jsm/",
"three/examples/jsm/":"/node_modules/three/examples/jsm/",
"three-mesh-bvh":"/node_modules/three-mesh-bvh/build/index.module.js",
"three-gpu-pathtracer":"/node_modules/three-gpu-pathtracer/build/index.module.js"}}</script>
</head><body>
<script type="module">
// Rendu PHOTORÉALISTE (lancer de rayons) d'une version de Céleste : verre réel (réfraction),
// sources LED dans les sphères, éclairage global, intérieur en pierre, enduit et laiton.
import * as THREE from "three";
import { WebGLPathTracer } from "three-gpu-pathtracer";

const q = new URLSearchParams(location.search);
const shape = q.get("shape") || "round";
const n = Number(q.get("n") || 14);
const W = Number(q.get("w") || 40) / 100;
const D = Number(q.get("d") || W * 100) / 100;
const H = Number(q.get("h") || 3);
const seed = Number(q.get("seed") || 7);
const SAMPLES = Number(q.get("samples") || 160);
const TEMP = q.get("temp") || "chaud"; // chaud | neutre | froid
const WIDTH = Number(q.get("width") || 960), HEIGHT = Math.round(WIDTH * 1.25);
const LIGHT = { chaud: 0xffb877, neutre: 0xfff0dc, froid: 0xe4eeff }[TEMP];

let s = seed >>> 0;
const rand = () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setSize(WIDTH, HEIGHT); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = Number(q.get("exposure") || 1.0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
// Environnement très faible et chaud (lumière résiduelle d'une soirée).
scene.environment = (() => { const t = new THREE.DataTexture(new Float32Array([0.05, 0.04, 0.032, 1]), 1, 1, THREE.RGBAFormat, THREE.FloatType); t.mapping = THREE.EquirectangularReflectionMapping; t.needsUpdate = true; return t; })();

// ── Pièce ──
const ceilingY = 0, floorY = -(H + 1.4);
const roomW = Math.max(3.5, H * 1.2 + W * 1.5);
const plaster = new THREE.MeshStandardMaterial({ color: 0xc9b7a3, roughness: 0.9 });
const box = (w, h, d, mat, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); scene.add(m); return m; };
const midRoomY = (ceilingY + floorY) / 2, roomH = H + 6;
box(roomW * 3, roomH, 0.1, plaster, 0, midRoomY, -roomW * 0.5 - 0.05);                 // mur du fond
box(0.1, roomH, roomW * 3, plaster.clone(), -roomW * 0.75, midRoomY, 0).material.color.set(0xb9a690); // mur gauche
box(roomW * 4, 0.1, roomW * 4, new THREE.MeshStandardMaterial({ color: 0xe8ded2, roughness: 0.95 }), 0, ceilingY + 0.05, 0);
box(roomW * 4, 0.1, roomW * 4, new THREE.MeshStandardMaterial({ color: 0xd8d1c8, roughness: 0.18 }), 0, floorY - 0.05, 0); // pierre polie
const wood = new THREE.MeshStandardMaterial({ color: 0x6b4a33, roughness: 0.6 });
for (let i = 0; i < 16; i++) box(0.035, roomH, 0.045, wood, -roomW * 0.72 + i * 0.075, midRoomY, -roomW * 0.5 + 0.03);
// Palier : dalle, garde-corps en verre, main courante laiton.
const railY = ceilingY - H * 0.62, railZ = -roomW * 0.5 + 0.95;
box(roomW * 2.2, 0.28, 1.0, new THREE.MeshStandardMaterial({ color: 0xe2d9cd, roughness: 0.85 }), 0, railY - 1.14, -roomW * 0.5 + 0.5);
box(roomW * 2.2, 1.0, 0.012, new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 1, roughness: 0.02, ior: 1.5, thickness: 0.012 }), 0, railY - 0.52, railZ);
box(roomW * 2.2, 0.045, 0.055, new THREE.MeshStandardMaterial({ color: 0xc19a5b, metalness: 1, roughness: 0.22 }), 0, railY, railZ);
// Lumière d'appoint : spots encastrés sous la dalle et lueur de plafond.
const fill = new THREE.RectAreaLight(0xffe2bd, 0.35, roomW * 2, 1.2); fill.position.set(0, ceilingY - 0.02, 1.2); fill.lookAt(0, floorY, 1.2); scene.add(fill);
for (let k = 0; k < 5; k++) { const sp = new THREE.SpotLight(0xffd7a3, 1.6, 0, 0.55, 0.6, 2); sp.position.set(-roomW * 0.6 + k * roomW * 0.32, railY - 1.29, -roomW * 0.5 + 0.5); sp.target.position.set(sp.position.x, floorY, sp.position.z + 0.4); scene.add(sp, sp.target); }

// ── Luminaire ──
const chrome = new THREE.MeshStandardMaterial({ color: 0xe6e6e6, metalness: 1, roughness: 0.08 });
const canopyT = 0.05;
const canopy = shape === "round" ? new THREE.Mesh(new THREE.CylinderGeometry(W / 2, W / 2, canopyT, 96), chrome) : new THREE.Mesh(new THREE.BoxGeometry(W, canopyT, D), chrome);
canopy.position.y = ceilingY - canopyT / 2; scene.add(canopy);

const margin = 0.04, pts = [];
const minDist = Math.max(0.035, Math.sqrt((W * D) / Math.max(n, 1)) * 0.55);
let guard = 0;
while (pts.length < n && guard++ < 20000) {
  let x, z;
  if (shape === "round") { const a = rand() * Math.PI * 2, r = Math.sqrt(rand()) * (W / 2 - margin); x = Math.cos(a) * r; z = Math.sin(a) * r; }
  else { x = (rand() - 0.5) * (W - 2 * margin); z = (rand() - 0.5) * Math.max(D - 2 * margin, 0.001); }
  if (pts.every((p) => Math.hypot(p.x - x, p.z - z) > minDist * (guard > 15000 ? 0.4 : 1))) pts.push({ x, z });
}
const order = pts.map((p) => ({ ...p, a: Math.atan2(p.z, p.x) }));
if (shape === "round") order.sort((a, b) => a.a - b.a); else order.sort(() => rand() - 0.5);

const R = 0.075;
const glass = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 1, roughness: 0.0, ior: 1.52, thickness: 0.006, metalness: 0 });
const crystal = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 1, roughness: 0.25, ior: 1.5, thickness: 0.03 }); // cylindre intérieur dépoli
const ledMat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: LIGHT, emissiveIntensity: 9 });
const bubbleMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 1, roughness: 0, ior: 1.0, thickness: 0.001 });
const wireMat = new THREE.MeshStandardMaterial({ color: 0xd8d8d8, metalness: 0.8, roughness: 0.3 });
const sphereGeo = new THREE.SphereGeometry(R, 64, 40);
const lightPerSphere = Math.min(1.4, 18 / n);
order.forEach((p, k) => {
  const t = order.length > 1 ? k / (order.length - 1) : 0;
  const drop = 0.35 + (shape === "round" ? t : rand()) * (H - 0.45) + (rand() - 0.5) * 0.12;
  const y = ceilingY - canopyT - drop;
  const g = new THREE.Group(); g.position.set(p.x, y, p.z);
  g.add(new THREE.Mesh(sphereGeo, glass));
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.28, R * 0.36, R * 0.85, 32), crystal); cyl.position.y = -R * 0.1; g.add(cyl);
  const led = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.12, R * 0.12, R * 0.35, 16), ledMat); led.position.y = -R * 0.12; g.add(led);
  for (let b = 0; b < 30; b++) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.0025 + rand() * 0.002, 8, 6), bubbleMat); m.position.copy(new THREE.Vector3(rand() - 0.5, rand() - 0.5, rand() - 0.5).normalize().multiplyScalar(R * (0.5 + rand() * 0.42))); g.add(m); }
  const pl = new THREE.PointLight(LIGHT, lightPerSphere, 0, 2); pl.position.y = -R * 0.12; g.add(pl);
  scene.add(g);
  const len = drop - R;
  const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.0012, 0.0012, len, 6), wireMat);
  wire.position.set(p.x, ceilingY - canopyT - len / 2, p.z); scene.add(wire);
});

// ── Caméra ──
const camera = new THREE.PerspectiveCamera(34, WIDTH / HEIGHT, 0.05, 100);
const midY = ceilingY - (H + 0.2) / 2, span = H + 0.55;
const dist = span / (2 * Math.tan(THREE.MathUtils.degToRad(17))) * 1.02;
camera.position.set(dist * 0.35, midY - span * 0.12, dist * 0.94);
camera.lookAt(0, midY + 0.05, 0);

const pt = new WebGLPathTracer(renderer);
pt.tiles.set(2, 2);
pt.bounces = 6;
pt.transmissiveBounces = 10;
pt.filterGlossyFactor = 0.5;
pt.minSamples = 1;
pt.renderToCanvas = true;
pt.setScene(scene, camera);
const t0 = performance.now();
function step() {
  for (let i = 0; i < 4; i++) pt.renderSample();
  window.__progress = pt.samples;
  if (pt.samples >= SAMPLES) { window.__ms = performance.now() - t0; window.__done = true; return; }
  requestAnimationFrame(step);
}
step();
</script></body></html>
