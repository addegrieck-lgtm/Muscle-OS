<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Visualisation de Luciole d'après les photos du fabricant : anneau (ou barre, ou tige centrale pour
// le Ø50), ramure de tiges fines en Y, chaque extrémité portant un support blanc et un diffuseur
// acrylique dépoli ovale aplati ; câbles vers un pavillon rond de la couleur de la structure.
// Paramètres : form (ring | stem | bar), w (cm), lights, finish, temp (chaud | froid), seed.
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

const q = new URLSearchParams(location.search);
const form = q.get("form") || "ring";
const W = Number(q.get("w") || 80) / 100;
const LIGHTS = Number(q.get("lights") || 108);
const FINISH = q.get("finish") || "or-rose";
const TEMP = q.get("temp") || "chaud";
const seed = Number(q.get("seed") || 11);
const SCALE = 2, WIDTH = 1200, HEIGHT = 1500;

const METAL = {
  "or-champagne": { color: 0xd8bf8a, metalness: 1, roughness: 0.3 },
  "or-rose": { color: 0xd49a84, metalness: 1, roughness: 0.28 },
  "sable-dore": { color: 0xbfa77e, metalness: 0.75, roughness: 0.55 },
  noir: { color: 0x1c1b1a, metalness: 0.4, roughness: 0.5 },
}[FINISH];
const LIGHT = { chaud: 0xffc488, froid: 0xe6efff }[TEMP];
const GLOW = { chaud: 0xfff1de, froid: 0xf6f9ff }[TEMP];

let s = seed >>> 0;
const rand = () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(WIDTH, HEIGHT); renderer.setPixelRatio(SCALE);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.25;

// ── Pièce (d'après la photo d'ambiance) : plafond en lames de bois sombre, mur en enduit beige ──
function canvasTex(size, draw, rx = 1, ry = 1) {
  const c = document.createElement("canvas"); c.width = c.height = size; draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const slats = canvasTex(512, (x, S) => {
  for (let i = 0; i < 32; i++) { const v = 52 + rand() * 18; x.fillStyle = `rgb(${v + 14},${v + 4},${v - 6})`; x.fillRect(0, i * 16, S, 13); x.fillStyle = "#1a120c"; x.fillRect(0, i * 16 + 13, S, 3); }
}, 3, 3);
const plaster = canvasTex(512, (x, S) => {
  x.fillStyle = "#a99581"; x.fillRect(0, 0, S, S);
  for (let i = 0; i < 30000; i++) { const v = 140 + rand() * 70; x.fillStyle = `rgba(${v},${v * 0.9},${v * 0.78},0.06)`; const r = rand() * 4; x.fillRect(rand() * S, rand() * S, r, r); }
}, 4, 4);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ map: slats, roughness: 0.7 }));
ceil.rotation.x = Math.PI / 2; scene.add(ceil);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(10, 6), new THREE.MeshStandardMaterial({ map: plaster, roughness: 0.95 }));
wall.position.set(0, -3, -1.8); scene.add(wall);
const side = new THREE.Mesh(new THREE.PlaneGeometry(10, 6), new THREE.MeshStandardMaterial({ map: plaster, color: 0xcfc2b2, roughness: 0.95 }));
side.rotation.y = Math.PI / 2; side.position.set(-2.6, -3, 0); scene.add(side);
scene.add(new THREE.HemisphereLight({ chaud: 0xffe6c6, froid: 0xeef2ff }[TEMP], 0x2a221c, 0.22));
const keyL = new THREE.DirectionalLight({ chaud: 0xffe2c0, froid: 0xf2f5ff }[TEMP], 0.5); keyL.position.set(2, -1, 3); scene.add(keyL);

// ── Luminaire ──
const metal = new THREE.MeshStandardMaterial(METAL);
const holderMat = new THREE.MeshStandardMaterial({ color: 0xf2efe9, roughness: 0.5, emissive: LIGHT, emissiveIntensity: 0.15 });
const diffMat = new THREE.MeshStandardMaterial({ color: 0xf7f2ea, emissive: GLOW, emissiveIntensity: 0.38, roughness: 0.65 });
const cableMat = new THREE.MeshStandardMaterial({ color: 0xcfcfcf, metalness: 0.8, roughness: 0.3 });
const Y0 = -0.6; // plan de l'anneau / de la barre sous le plafond
const group = new THREE.Group(); scene.add(group);

function rod(a, b, r, mat) {
  const d = new THREE.Vector3().subVectors(b, a); const len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 6), mat);
  m.position.copy(a).addScaledVector(d, 0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  group.add(m); return m;
}
const diffGeo = new THREE.SphereGeometry(1, 24, 16);
function tip(at, dir) {
  // support blanc court puis diffuseur ovale aplati, orienté dans le prolongement de la tige
  const h = at.clone().addScaledVector(dir, 0.018);
  rod(at, h, 0.0042, holderMat);
  const c = h.clone().addScaledVector(dir, 0.019);
  const m = new THREE.Mesh(diffGeo, diffMat);
  m.position.copy(c); m.scale.set(form === "stem" ? 0.021 : 0.017, form === "stem" ? 0.023 : 0.022, 0.0075);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  m.rotateY(rand() * Math.PI);
  group.add(m);
}
// Une « grappe » : tige principale puis fourches en Y, 3 extrémités par grappe.
function cluster(origin, outward, reach) {
  const dir = outward.clone().add(new THREE.Vector3((rand() - 0.5) * 0.9, (rand() - 0.62) * 1.3, (rand() - 0.5) * 0.9)).normalize();
  const p1 = origin.clone().addScaledVector(dir, reach * (0.35 + rand() * 0.2));
  rod(origin, p1, 0.0022, metal);
  const forks = [0, 1].map(() => dir.clone().add(new THREE.Vector3((rand() - 0.5) * 1.4, (rand() - 0.55) * 1.2, (rand() - 0.5) * 1.4)).normalize());
  forks.forEach((fd, i) => {
    const p2 = p1.clone().addScaledVector(fd, reach * (0.3 + rand() * 0.2));
    rod(p1, p2, 0.0018, metal);
    if (i === 0) {
      [0, 1].forEach(() => {
        const gd = fd.clone().add(new THREE.Vector3((rand() - 0.5) * 1.3, (rand() - 0.5) * 1.1, (rand() - 0.5) * 1.3)).normalize();
        const p3 = p2.clone().addScaledVector(gd, reach * (0.22 + rand() * 0.15));
        rod(p2, p3, 0.0015, metal); tip(p3, gd);
      });
    } else tip(p2, fd);
  });
}
const clusters = Math.round(LIGHTS / 3);
const canopy = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.055, 48), metal);
canopy.position.y = -0.0275; group.add(canopy);
const sleeve = (p) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.06, 12), metal); m.position.copy(p).add(new THREE.Vector3(0, 0.03, 0)); group.add(m); return p.clone().add(new THREE.Vector3(0, 0.06, 0)); };
const cable = (a, b) => rod(a, b, 0.0009, cableMat);

if (form === "ring") {
  const reach = Math.min(0.2, W * 0.16);
  const R = W / 2 - reach * 0.75;
  const torus = new THREE.Mesh(new THREE.TorusGeometry(R, 0.0075, 12, 160), metal);
  torus.rotation.x = Math.PI / 2; torus.position.y = Y0; group.add(torus);
  for (let k = 0; k < 3; k++) { const a = (k / 3) * Math.PI * 2 + 0.4; cable(sleeve(new THREE.Vector3(Math.cos(a) * R, Y0, Math.sin(a) * R)), new THREE.Vector3(0, -0.055, 0)); }
  for (let i = 0; i < clusters; i++) {
    const a = (i / clusters) * Math.PI * 2 + rand() * 0.2;
    const o = new THREE.Vector3(Math.cos(a) * R, Y0, Math.sin(a) * R);
    const out = new THREE.Vector3(Math.cos(a), 0, Math.sin(a)).multiplyScalar(rand() < 0.3 ? -0.6 : 1);
    cluster(o, out, reach);
  }
} else if (form === "stem") {
  // Ø50 (photo fabricant « 30 lights ») : câble unique → manchon → courte tige → nœud central ;
  // 6 branches maîtresses (2 montantes, 2 latérales, 2 descendantes) ramifiées en Y comme un arbre,
  // 5 diffuseurs ronds chacune (30 au total) ; silhouette en boule d'environ 50 cm.
  const hub = new THREE.Vector3(0, Y0, 0);
  const slBottom = hub.clone().add(new THREE.Vector3(0, 0.045, 0));
  const sl = new THREE.Mesh(new THREE.CylinderGeometry(0.0075, 0.0075, 0.075, 12), metal);
  sl.position.copy(slBottom).add(new THREE.Vector3(0, 0.0375, 0)); group.add(sl);
  rod(hub, slBottom, 0.003, metal);
  cable(slBottom.clone().add(new THREE.Vector3(0, 0.075, 0)), new THREE.Vector3(0, -0.055, 0));
  const deg = Math.PI / 180;
  const dirOf = (az, el) => new THREE.Vector3(Math.cos(el * deg) * Math.cos(az * deg), Math.sin(el * deg), Math.cos(el * deg) * Math.sin(az * deg));
  // Fourche en Y : les deux branches s'ouvrent symétriquement autour de la direction, dans un plan
  // qui alterne (horizontal / vertical) à chaque niveau, avec un léger écart aléatoire.
  function limb(origin, d, len, tips, depth = 0) {
    const end = origin.clone().addScaledVector(d, len);
    rod(origin, end, tips > 2 ? 0.0024 : 0.0018, metal);
    if (tips === 1) { tip(end, d); return; }
    const ref = depth % 2 === 0 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(-d.z, 0, d.x);
    let axis = new THREE.Vector3().crossVectors(d, ref);
    if (axis.lengthSq() < 1e-4) axis = new THREE.Vector3(1, 0, 0);
    axis.normalize().applyAxisAngle(d, (rand() - 0.5) * 0.6);
    const sp = (32 + rand() * 10) * deg;
    const a = Math.ceil(tips / 2), b2 = tips - a;
    limb(end, d.clone().applyAxisAngle(axis, sp).normalize(), len * 0.8, a, depth + 1);
    limb(end, d.clone().applyAxisAngle(axis, -sp).normalize(), len * 0.8, b2, depth + 1);
  }
  const limbs = [[0, 30], [180, 26], [60, 4], [240, -2], [120, -24], [300, -38]];
  limbs.forEach(([az, el]) => limb(hub, dirOf(az + (rand() - 0.5) * 20, el + (rand() - 0.5) * 10), 0.072, Math.round(LIGHTS / limbs.length)));
} else {
  const L = W - 0.2;
  rod(new THREE.Vector3(-L / 2, Y0, 0), new THREE.Vector3(L / 2, Y0, 0), 0.0085, metal);
  [-L * 0.35, L * 0.35].forEach((x) => cable(sleeve(new THREE.Vector3(x, Y0, 0)), new THREE.Vector3(x * 0.15, -0.055, 0)));
  for (let i = 0; i < clusters; i++) {
    const x = -L / 2 + ((i + rand() * 0.6) / clusters) * L;
    const out = new THREE.Vector3((rand() - 0.5) * 0.8, rand() < 0.25 ? 0.3 : -0.25 - rand() * 0.5, (rand() < 0.5 ? -1 : 1) * (0.5 + rand() * 0.6)).normalize();
    cluster(new THREE.Vector3(x, Y0, 0), out, 0.2);
  }
}
// Quelques sources réelles pour éclairer la pièce (la lueur des diffuseurs est rendue par le bloom).
for (let k = 0; k < 8; k++) { const a = (k / 8) * Math.PI * 2; const pl = new THREE.PointLight(LIGHT, 0.14, 5, 2); const rr = Math.max(W * 0.35, 0.45); pl.position.set(Math.cos(a) * rr, Y0 - 0.08, Math.sin(a) * rr * 0.7 - 0.2); scene.add(pl); }

// ── Caméra : légère contre-plongée, comme les photos du fabricant ──
const camera = new THREE.PerspectiveCamera(34, WIDTH / HEIGHT, 0.02, 50);
const span = form === "stem" ? 0.95 : Math.max(1.15, (W + 0.5) * (HEIGHT / WIDTH) * 0.9);
const dist = span / (2 * Math.tan(THREE.MathUtils.degToRad(17)));
camera.position.set(dist * 0.1, Y0 - span * 0.32, dist * 0.98);
camera.lookAt(0, Y0 + 0.1, 0);

const composer = new EffectComposer(renderer);
composer.setPixelRatio(SCALE); composer.setSize(WIDTH, HEIGHT);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(WIDTH * SCALE, HEIGHT * SCALE), 0.32, 0.28, 0.88));
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null }, seed: { value: seed * 0.37 } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
  fragmentShader: "uniform sampler2D tDiffuse; uniform float seed; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + seed)*43758.5453); } void main(){ vec4 c = texture2D(tDiffuse, vUv); float d = distance(vUv, vec2(.5,.45)); c.rgb *= mix(1., .72, smoothstep(.38,.9,d)); c.rgb += (h(vUv*1400.)-.5)*.016; gl_FragColor = c; }",
}));
composer.render();
window.__done = true;
</script></body></html>
