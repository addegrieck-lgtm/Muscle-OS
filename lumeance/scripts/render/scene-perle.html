<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Visualisation de Perle (LUM-LUS-008) — modèle : perle-model.js.
// Paramètres : layout (single | line | round | free | spiral | rings), n (gouttes),
// canopy (Ø du pavillon, m) ou rect (« 0.6x0.12 »), finish (dore | chrome), temp (chaud | froid).
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { buildPerle } from "/scripts/render/perle-model.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { buildRoom } from "/scripts/render/room.js";

const t0 = performance.now();
const q = new URLSearchParams(location.search);
const LAYOUT = q.get("layout") || "free";
const N = Number(q.get("n") || 18);
const CANOPY = Number(q.get("canopy") || 0.5);
const RECT = q.get("rect") ? q.get("rect").split("x").map(Number) : null;
const FINISH = q.get("finish") || "dore";
const TEMP = q.get("temp") || "chaud";
const seed = 13 + N * 7 + LAYOUT.length;
// Aluminium doré ou chromé.
const METAL = {
  dore: { color: 0xd4ad62, metalness: 1, roughness: 0.22 },
  chrome: { color: 0xf0f1f4, metalness: 1, roughness: 0.14 },
}[FINISH];
const SCALE = 2, WIDTH = 1200, HEIGHT = 1500;


// Lumière chaude ou froide (« warm / cool light » du fournisseur).
const LIGHT = { chaud: 0xffc283, froid: 0xe4eeff }[TEMP];
const GLOW = { chaud: 0xffe2b8, froid: 0xf2f7ff }[TEMP];
const ROOM_TEMP = TEMP;

let s = seed >>> 0;
const rand = () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(WIDTH, HEIGHT); renderer.setPixelRatio(SCALE);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.22;

// ── Pièce : salon clair (comme la cage d'escalier du fournisseur) : les anneaux fumés ressortent ──
buildRoom(scene, { rand, temp: ROOM_TEMP, theme: "salon", wallZ: -2.6 });
const keyL = new THREE.DirectionalLight({ chaud: 0xffe2c0, froid: 0xf2f5ff }[ROOM_TEMP], 0.28); keyL.position.set(2, -1, 3); scene.add(keyL);

// ── Luminaire : gouttes sous le pavillon (fils raccourcis pour le cadrage, réglables) ──
const { minY, width } = buildPerle({ THREE, scene, rand, layout: LAYOUT, n: N, canopy: CANOPY, rect: RECT, METAL, LIGHT, GLOW, topY: -0.35 });

// ── Caméra : légère contre-plongée, pavillon et plaques dans le cadre ──
const camera = new THREE.PerspectiveCamera(34, WIDTH / HEIGHT, 0.02, 50);
const span = Math.max(-minY + 0.3, (width + 0.5) * (HEIGHT / WIDTH));
const dist = span / (2 * Math.tan(THREE.MathUtils.degToRad(17)));
const lookY = minY / 2 + 0.02;
camera.position.set(dist * 0.08, lookY - span * 0.18, dist * 0.98);
camera.lookAt(0, lookY, 0);

const composer = new EffectComposer(renderer);
composer.setPixelRatio(SCALE); composer.setSize(WIDTH, HEIGHT);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(WIDTH * SCALE, HEIGHT * SCALE), 0.3, 0.22, 0.92));
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null }, seed: { value: seed * 0.37 } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
  fragmentShader: "uniform sampler2D tDiffuse; uniform float seed; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + seed)*43758.5453); } void main(){ vec4 c = texture2D(tDiffuse, vUv); float d = distance(vUv, vec2(.5,.45)); c.rgb *= mix(1., .72, smoothstep(.38,.9,d)); c.rgb += (h(vUv*1400.)-.5)*.016; gl_FragColor = c; }",
}));
composer.render();
window.__ms = performance.now() - t0;
window.__done = true;
</script></body></html>
