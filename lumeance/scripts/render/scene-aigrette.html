<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Visualisation d'Aigrette d'après les photos du fabricant : cœur métallique d'où rayonnent des
// tiges fines, chacune terminée par une petite ramure portant des perles de cristal ; ampoules G9
// LED en capsule autour du cœur. Rond : boule de Ø w, câble unique vers un pavillon rond.
// Linéaire : barre horizontale de longueur w, hauteur 40 cm, deux câbles vers un pavillon de 50 cm.
// Paramètres : form (round | bar), w (cm), bulbs, finish (dore | chrome), temp (chaud | neutre | froid), seed.
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { buildAigrette } from "/scripts/render/aigrette-model.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { buildRoom } from "/scripts/render/room.js";

const t0 = performance.now();
const q = new URLSearchParams(location.search);
const form = q.get("form") || "round";
const W = Number(q.get("w") || 50) / 100;
const BULBS = Number(q.get("bulbs") || 9);
const FINISH = q.get("finish") || "dore";
const TEMP = q.get("temp") || "chaud";
const seed = Number(q.get("seed") || 7);
const SCALE = 2, WIDTH = 1200, HEIGHT = 1500;

const METAL = {
  dore: { color: 0xd6b26e, metalness: 1, roughness: 0.26 },
  chrome: { color: 0xe4e6ea, metalness: 1, roughness: 0.08 },
}[FINISH];
const LIGHT = { chaud: 0xffc283, neutre: 0xfff0dc, froid: 0xe4eeff }[TEMP];
const GLOW = { chaud: 0xffe2b8, neutre: 0xfff8ee, froid: 0xf2f7ff }[TEMP];

let s = seed >>> 0;
const rand = () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(WIDTH, HEIGHT); renderer.setPixelRatio(SCALE);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.22;

// ── Pièce : salon (enduit à la chaux, chêne cannelé, œuvre, fenêtre cintrée) — voir room.js ──
buildRoom(scene, { rand, temp: TEMP, theme: "salon", wallZ: -1.8 });
const keyL = new THREE.DirectionalLight({ chaud: 0xffe2c0, neutre: 0xfff6ec, froid: 0xf2f5ff }[TEMP], 0.28); keyL.position.set(2, -1, 3); scene.add(keyL);

// ── Luminaire (modèle partagé : aigrette-model.js) ──
const { Y0 } = buildAigrette({ THREE, scene, rand, form, W, BULBS, METAL, LIGHT, GLOW, barY: -0.7 });
const UP = new THREE.Vector3(0, 1, 0);

// ── Caméra : légère contre-plongée, comme les photos du fabricant ──
const camera = new THREE.PerspectiveCamera(34, WIDTH / HEIGHT, 0.02, 50);
const span = form === "round" ? (0.55 + W * 1.05) * 1.3 : Math.max(1.15, (W + 0.45) * (HEIGHT / WIDTH) * 0.95);
const dist = span / (2 * Math.tan(THREE.MathUtils.degToRad(17)));
const lookY = form === "round" ? -(0.55 + W) / 2 + 0.02 : Y0 + 0.28;
camera.position.set(dist * 0.1, lookY - span * 0.3, dist * 0.98);
camera.lookAt(0, lookY, 0);

const composer = new EffectComposer(renderer);
composer.setPixelRatio(SCALE); composer.setSize(WIDTH, HEIGHT);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(WIDTH * SCALE, HEIGHT * SCALE), 0.3, 0.22, 0.92));
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null }, seed: { value: seed * 0.37 } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
  fragmentShader: "uniform sampler2D tDiffuse; uniform float seed; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + seed)*43758.5453); } void main(){ vec4 c = texture2D(tDiffuse, vUv); float d = distance(vUv, vec2(.5,.45)); c.rgb *= mix(1., .72, smoothstep(.38,.9,d)); c.rgb += (h(vUv*1400.)-.5)*.016; gl_FragColor = c; }",
}));
composer.render();
window.__ms = performance.now() - t0;
window.__done = true;
</script></body></html>
