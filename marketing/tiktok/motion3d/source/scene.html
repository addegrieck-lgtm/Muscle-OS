<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:CP;font-weight:700;src:url(chakra-petch-latin-700-normal.woff2)}
html,body{margin:0;background:#07070a;overflow:hidden}
canvas{display:block}
#ov{position:absolute;inset:0;pointer-events:none;font-family:CP;color:#fff;text-align:center}
.t{position:absolute;left:0;right:0;opacity:0;letter-spacing:.12em;text-shadow:0 4px 24px #000c}
#k{top:1240px;font-size:44px;color:#d21f2f}
#n{top:1300px;font-size:92px;line-height:1.05}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body><div id="ov"><div class="t" id="k">◆ KOTH ◆</div><div class="t" id="n">GOUFFRE<br>DE VÆLOR</div></div>
<script type="module">
import * as THREE from "three";
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x140709);
scene.fog = new THREE.Fog(0x140709, 140, 420);
const cam = new THREE.PerspectiveCamera(50, W / H, 0.5, 1200);
scene.add(new THREE.HemisphereLight(0xffd9c8, 0x2a0a08, 1.1));
const sun = new THREE.DirectionalLight(0xffe2cc, 2.2); sun.position.set(-120, 200, 80); scene.add(sun);
const lavaLight = new THREE.PointLight(0xff5a1a, 4, 220, 1.2); lavaLight.position.set(100, 40, 100); scene.add(lavaLight);

const buf = await (await fetch(new URLSearchParams(location.search).get("bin") || "koth.bin")).arrayBuffer();
const dv = new DataView(buf); const N = buf.byteLength / 10;
const box = new THREE.BoxGeometry(1, 1, 1);
const solidM = new THREE.MeshLambertMaterial();
const glowM = new THREE.MeshBasicMaterial();
let ns = 0, ng = 0;
for (let i = 0; i < N; i++) (dv.getUint8(i * 10 + 9) & 1) ? ng++ : ns++;
const solid = new THREE.InstancedMesh(box, solidM, ns), glow = new THREE.InstancedMesh(box, glowM, ng);
const m = new THREE.Matrix4(), c = new THREE.Color(); let is = 0, ig = 0;
function hash(x, y, z) { let h = (x * 374761393 + y * 668265263 + z * 1274126177) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
for (let i = 0; i < N; i++) {
  const o = i * 10, x = dv.getInt16(o, true), y = dv.getInt16(o + 2, true), z = dv.getInt16(o + 4, true);
  const f = dv.getUint8(o + 9), j = 0.88 + hash(x, y, z) * 0.24;
  const small = f & 2 ? 0.8 : 1;
  m.makeScale(small, f & 2 ? 0.9 : 1, small).setPosition(x + 0.5, y + 0.5, z + 0.5);
  c.setRGB(dv.getUint8(o + 6) / 255 * j, dv.getUint8(o + 7) / 255 * j, dv.getUint8(o + 8) / 255 * j, THREE.SRGBColorSpace);
  if (f & 1) { glow.setMatrixAt(ig, m); glow.setColorAt(ig++, c); } else { solid.setMatrixAt(is, m); solid.setColorAt(is++, c); }
}
scene.add(solid, glow);
// faisceau de balise
const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 200, 12), new THREE.MeshBasicMaterial({ color: 0xff2a3a, transparent: true, opacity: 0.55, fog: false }));
beam.position.set(100.5, 68 + 100, 100.5); scene.add(beam);

const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const ov = (id, t, a, b) => { const e = document.getElementById(id); const v = Math.max(0, Math.min(1, (t - a) / 0.08)) * Math.max(0, Math.min(1, (b - t) / 0.08)); e.style.opacity = v; e.style.transform = `translateY(${(1 - v) * 20}px)`; };
window.renderAt = (t) => {
  const e = ease(t);
  const ang = lerp(1.25, 0.55, e), r = 50 + 190 * (1 - e), h = 84 + 160 * Math.pow(1 - e, 0.35);
  cam.position.set(100 + Math.cos(ang) * r, h, 100 + Math.sin(ang) * r);
  cam.lookAt(100, lerp(40, 70, e), 100);
  lavaLight.intensity = 4 + Math.sin(t * 40) * 0.6;
  ov("k", t, 0.45, 1.2); ov("n", t, 0.5, 1.2);
  renderer.render(scene, cam);
};
window.ready = true;
</script></body></html>
