<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:CP;font-weight:700;src:url(chakra-petch-latin-700-normal.woff2)}
html,body{margin:0;background:#07070a;overflow:hidden}
canvas{display:block}
#ov{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;pointer-events:none;font-family:CP;color:#fff;text-align:center}
#shade{position:absolute;left:0;right:0;bottom:0;height:900px;background:linear-gradient(#0000,#000c)}
.t{position:absolute;left:0;right:0;opacity:0;letter-spacing:.12em;text-shadow:0 4px 24px #000c}
#k{top:1240px;font-size:44px;color:#e2303f}
#n{top:1300px;font-size:92px;line-height:1.05}
</style>
<script src="shots.js"></script>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body><div id="ov"><div id="shade"></div><div id="fade" style="position:absolute;inset:0;background:#07070a;opacity:0"></div><div class="t" id="k"></div><div class="t" id="n"></div></div>
<script type="module">
import * as THREE from "three";
const q = new URLSearchParams(location.search);
const S = window.SHOTS[q.get("shot") || "koth"];
const scale = +(q.get("scale") || 1), W = 1080 * scale, H = 1920 * scale;
document.getElementById("ov").style.transform = `scale(${scale})`;
document.getElementById("k").innerHTML = q.has("notitle") ? "" : S.kicker;
document.getElementById("n").innerHTML = q.has("notitle") ? "" : S.title;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(S.bg);
scene.fog = new THREE.Fog(S.bg, S.fog[0], S.fog[1]);
const cam = new THREE.PerspectiveCamera(50, W / H, 0.5, 1500);
scene.add(new THREE.HemisphereLight(S.hemi[0], S.hemi[1], 1.1));
const sun = new THREE.DirectionalLight(0xffe2cc, S.sun); sun.position.set(-120, 200, 80); scene.add(sun);
let lavaLight = null;
if (S.lava) { lavaLight = new THREE.PointLight(0xff5a1a, 4, 220, 1.2); lavaLight.position.set(...S.lava); scene.add(lavaLight); }

const buf = await (await fetch(S.bin)).arrayBuffer();
const dv = new DataView(buf); const N = buf.byteLength / 10;
const box = new THREE.BoxGeometry(1, 1, 1);
let ns = 0, ng = 0;
for (let i = 0; i < N; i++) (dv.getUint8(i * 10 + 9) & 1) ? ng++ : ns++;
const solid = new THREE.InstancedMesh(box, new THREE.MeshLambertMaterial(), ns), glow = new THREE.InstancedMesh(box, new THREE.MeshBasicMaterial(), Math.max(ng, 1));
const m = new THREE.Matrix4(), c = new THREE.Color(); let is = 0, ig = 0;
function hash(x, y, z) { let h = (x * 374761393 + y * 668265263 + z * 1274126177) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
for (let i = 0; i < N; i++) {
  const o = i * 10, x = dv.getInt16(o, true), y = dv.getInt16(o + 2, true), z = dv.getInt16(o + 4, true);
  const f = dv.getUint8(o + 9), j = 0.88 + hash(x, y, z) * 0.24;
  const small = f & 2 ? 0.8 : 1;
  m.makeScale(small, f & 2 ? 0.9 : 1, small).setPosition(x + 0.5, y + 0.5, z + 0.5);
  c.setRGB(dv.getUint8(o + 6) / 255 * j, dv.getUint8(o + 7) / 255 * j, dv.getUint8(o + 8) / 255 * j, THREE.SRGBColorSpace);
  if (f & 1) { glow.setMatrixAt(ig, m); glow.setColorAt(ig++, c); } else { solid.setMatrixAt(is, m); solid.setColorAt(is++, c); }
}
glow.count = ng;
scene.add(solid, glow);
if (S.beam) {
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 200, 12), new THREE.MeshBasicMaterial({ color: 0xff2a3a, transparent: true, opacity: 0.55, fog: false }));
  beam.position.set(S.beam[0], S.beam[1] + 100, S.beam[2]); scene.add(beam);
}
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const ov = (id, t, a, b) => { const e = document.getElementById(id); const v = Math.max(0, Math.min(1, (t - a) / 0.1)) * Math.max(0, Math.min(1, (b - t) / 0.06)); e.style.opacity = v; e.style.transform = `translateY(${(1 - v) * 20}px)`; };
window.renderAt = (t) => {
  const e = ease(t);
  const ang = lerp(S.ang[0], S.ang[1], e), r = lerp(S.r[1], S.r[0], 1 - e), h = S.h[1] + (S.h[0] - S.h[1]) * Math.pow(1 - e, S.hPow);
  cam.position.set(S.c[0] + Math.cos(ang) * r, h, S.c[2] + Math.sin(ang) * r);
  cam.lookAt(S.c[0], lerp(S.look[0], S.look[1], e), S.c[2]);
  if (lavaLight) lavaLight.intensity = 4 + Math.sin(t * 40) * 0.6;
  document.getElementById("fade").style.opacity = Math.max(0, 1 - t / 0.05, (t - 0.95) / 0.05);
  ov("k", t, 0.25, 0.97); ov("n", t, 0.3, 0.97);
  renderer.render(scene, cam);
};
window.ready = true;
</script></body></html>
