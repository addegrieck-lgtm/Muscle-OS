# ╔══════════════════════════════════════════════════════════════╗
# ║                  VaeloriaNoel — configuration                ║
# ║  Calendrier de l'Avent · cadeau du jour · chasse aux cadeaux ║
# ║  · parcours du donjon · neige au spawn                       ║
# ╚══════════════════════════════════════════════════════════════╝
# Après modification : /noel reload
# Textes au format MiniMessage, avec les couleurs du logo : <ruby> <ruby_hi> <silver> <steel> <ash> <gold> <gain> <loss>.
#
# RÉCOMPENSES — même format partout :
#   argent: 500                     (monnaie Vault du serveur, la même que le marché)
#   objets: ["GOLDEN_CARROT:8", "EXPERIENCE_BOTTLE:4"]   (MATÉRIAU:quantité ; ce qui ne tient pas tombe au sol)
#   commandes: ["crate give {player} vote 1"]          (console ; {player} = pseudo)
#   texte: "<steel>8 carottes dorées"                  (affiché au joueur)
# Les objets choisis ne se revendent pas au marché (steaks, carottes dorées, fioles d'XP, pommes dorées) :
# Noël ne crée pas d'argent caché, comme les votes.

fuseau: "Europe/Paris"
# Pour tester hors saison : "2026-12-05" fait croire au plugin qu'on est ce jour-là. Laisser vide en production.
date-simulee: ""

# ── Calendrier de l'Avent (/calendrier) ───────────────────────────
calendrier:
  actif: true
  annee: 2026
  # true = un joueur peut ouvrir une case passée qu'il a manquée (jusqu'au 24). false = seulement la case du jour.
  rattrapage: false
  # Récompense par défaut d'une case, complétée ou remplacée jour par jour ci-dessous.
  defaut:
    argent: 600
    objets: ["COOKED_BEEF:16", "EXPERIENCE_BOTTLE:6"]
    texte: "<steel>600 $, 16 steaks et 6 fioles d'XP"
  jours:
    5:  {argent: 800, objets: ["GOLDEN_CARROT:16"], commandes: ["crate give {player} vote 1"], texte: "<steel>800 $, 16 carottes dorées et une <gold>clé Vote"}
    10: {argent: 1000, objets: ["GOLDEN_APPLE:2"], commandes: ["crate give {player} vote 2"], texte: "<steel>1 000 $, 2 pommes dorées et 2 <gold>clés Vote"}
    15: {argent: 1200, objets: ["GOLDEN_APPLE:3"], commandes: ["crate give {player} rare 1"], texte: "<steel>1 200 $, 3 pommes dorées et une <gold>clé Rare"}
    20: {argent: 1500, objets: ["EXPERIENCE_BOTTLE:32"], commandes: ["crate give {player} rare 1"], texte: "<steel>1 500 $, 32 fioles d'XP et une <gold>clé Rare"}
    24: {argent: 2500, objets: ["GOLDEN_APPLE:4"], commandes: ["crate give {player} legendaire 1"], texte: "<steel>2 500 $, 4 pommes dorées et une <gold>clé Légendaire"}

# ── Cadeau du jour du Père Noël (/cadeau, aussi via le PNJ) ───────
cadeau-du-jour:
  actif: true
  debut: "2026-12-01"
  fin: "2027-01-06"
  # Un cadeau tiré au sort par jour et par joueur (poids = chance relative).
  tirage:
    - {poids: 40, argent: 300, objets: ["COOKED_BEEF:16"], texte: "<steel>300 $ et 16 steaks"}
    - {poids: 30, argent: 500, objets: ["GOLDEN_CARROT:12"], texte: "<steel>500 $ et 12 carottes dorées"}
    - {poids: 20, argent: 800, objets: ["GOLDEN_APPLE:1"], texte: "<steel>800 $ et une pomme dorée"}
    - {poids: 9, objets: ["EXPERIENCE_BOTTLE:16"], commandes: ["crate give {player} vote 1"], texte: "<steel>16 fioles d'XP et une <gold>clé Vote"}
    - {poids: 1, commandes: ["crate give {player} legendaire 1"], texte: "<gold><b>une clé Légendaire !</b>", annonce: true}

# ── Chasse aux cadeaux (/chasse) ──────────────────────────────────
# Clic sur un paquet caché : récompense une fois par joueur et par paquet. Tous trouvés : grande récompense.
chasse:
  actif: true
  debut: "2026-12-01"
  fin: "2027-01-06"
  # Petites étincelles visibles par le joueur seulement, autour des paquets qu'il n'a pas encore trouvés.
  particules: true
  rayon-particules: 10
  par-cadeau: {argent: 250, objets: ["GOLDEN_CARROT:4"], texte: "<steel>250 $ et 4 carottes dorées"}
  tous-trouves: {argent: 5000, commandes: ["crate give {player} legendaire 1"], texte: "<gold><b>5 000 $ et une clé Légendaire</b>"}
  # Coordonnées générées avec le spawn fusionné (vaeloria-spawn, scripts/configs.mjs). Le bloc de laine du paquet.
  cadeaux:
    - {id: 1, zone: "Île du spawn", world: spawn, x: 58, y: 101, z: 85}
    - {id: 2, zone: "Île du spawn", world: spawn, x: 62, y: 101, z: 10}
