# ── Parcours du donjon (/parcours) ────────────────────────────────
# Plaque de départ (pesée légère) au pied du donjon, plaque d'arrivée (pesée lourde) dans la loggia.
# Actif toute l'année. Une téléportation, le vol ou un changement de mode de jeu annulent la course.
parcours:
  actif: true
  depart: {world: spawn, x: -42, y: 101, z: -101}
  arrivee: {world: spawn, x: -42, y: 128, z: -112}
  # Pas de dégâts de chute dans cette zone (personne ne meurt en ratant un saut).
  zone: {world: spawn, x0: -60, y0: 95, z0: -128, x1: -24, y1: 149, z1: -92}
  sans-degats-de-chute: true
  # Récompense une fois par jour (heure de Paris).
  recompense: {argent: 500, commandes: ["crate give {player} vote 1"], texte: "<steel>500 $ et une <gold>clé Vote"}
  # Annonce à tout le serveur quand le record du serveur tombe.
  annonce-record: true

# ── Neige au spawn (/noel neige on|off) ───────────────────────────
# Passe la zone en biome enneigé et y fait neiger (orage permanent dans ce monde seulement). /noel neige off remet
# le biome d'origine et le beau temps. Les couches de neige ne s'accumulent pas (règle snowAccumulationHeight = 0).
neige:
  zone: {world: spawn, x0: -250, y0: 0, z0: -225, x1: 310, y1: 200, z1: 200}
  biome: "snowy_plains"
  blocs-par-tick: 4000

messages:
  prefixe: "<ruby_hi>❄</ruby_hi> <graphite>»</graphite> "
  hors-saison: "<steel>Ce n'est pas encore la saison : reviens en décembre !"
  calendrier-titre: "<ruby_hi>❄</ruby_hi> <graphite>Calendrier de l'Avent"
  calendrier-ouvert: "<steel>Case du <snow><jour> décembre</snow> ouverte : <gain><texte></gain>"
  calendrier-deja: "<loss>Tu as déjà ouvert la case du <jour> décembre."
  calendrier-trop-tot: "<loss>Patience ! Cette case s'ouvre le <jour> décembre."
  calendrier-manquee: "<ash>Cette case est passée."
  cadeau-recu: "<steel>Le Père Noël t'offre <gain><texte></gain> <steel>! Reviens demain."
  cadeau-deja: "<loss>Tu as déjà reçu ton cadeau aujourd'hui. Reviens demain !"
  cadeau-annonce: "<snow><player></snow> <steel>a reçu <texte> <steel>du Père Noël !"
  chasse-trouve: "<gain>Cadeau trouvé !</gain> <steel>(<snow><n>/<total></snow>) <ash>· <texte>"
  chasse-deja: "<ash>Tu as déjà trouvé ce cadeau (<n>/<total>)."
  chasse-fini: "<gold><b>Tous les cadeaux trouvés !</b></gold> <steel>Récompense : <texte>"
  chasse-annonce: "<snow><player></snow> <steel>a trouvé les <total> cadeaux cachés du spawn !"
  chasse-progres: "<steel>Cadeaux trouvés : <snow><n>/<total></snow>"
  chasse-zone: "<ash>• <silver><zone></silver> : <snow><reste></snow> <ash>à trouver"
  parcours-depart: "<steel>Chrono lancé ! Grimpe jusqu'à la loggia du donjon."
  parcours-annule: "<loss>Parcours annulé (<raison>)."
  parcours-fini: "<gain>Arrivée !</gain> <steel>Temps : <snow><temps></snow> <ash>(record perso : <record>)"
  parcours-recompense: "<steel>Récompense du jour : <gain><texte></gain>"
  parcours-record-serveur: "<snow><player></snow> <steel>bat le record du parcours du donjon : <gold><temps></gold> !"
  parcours-info: "<steel>Ton record : <snow><record></snow> <ash>· /parcours top"
  parcours-top-titre: "<ruby_hi>❄</ruby_hi> <silver>Parcours du donjon — meilleurs temps"
  parcours-top-ligne: "<ash><rang>.</ash> <snow><player></snow> <steel><temps>"
  neige-on: "<steel>La neige tombe sur le spawn (biome <snow><biome></snow>, <n> blocs)."
  neige-off: "<steel>Fin de la neige : biome <snow><biome></snow> rétabli."
  recharge: "<gain>VaeloriaNoel rechargé.</gain>"
