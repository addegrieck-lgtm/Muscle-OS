# ╔══════════════════════════════════════════════════════════════╗
# ║                 VæloriaShop — articles et prix               ║
# ╚══════════════════════════════════════════════════════════════╝
# Champs d'un article :
#   material      objet Minecraft (ou tool: <outil de config.yml>, ou spawner: <créature>)
#   buy / sell    prix d'achat / de rachat à l'unité (0 ou absent = impossible)
#   level         rang de marchand requis pour l'ACHETER (1 = tout le monde)
#   daily-limit   achats maximum par joueur et par jour
#   saturation    seuil de saturation propre à l'article (sinon market.saturation)
#   dynamic       false = prix de rachat fixe (pas de saturation ni de cours du jour)
#   featured      false = jamais tiré au sort pour le cours du jour
#   income        revenu indicatif par heure, affiché sur les générateurs
#   points        prix en points boutique (catégories « premium: true » seulement, vendues dans /boutique)
#   kit           accès définitif à un kit EssentialsX (voir config.yml : kits)
#   potion        type de potion (STRONG_HEALING…) ; enchantments { protection: 4 } ; name ; lore
#
# REPÈRES D'ÉQUILIBRAGE (prix de base, avant marché et bonus)
#   Débutant, houe I, à la main ............. ~1 500 à 3 000 $/h
#   Champs + houe II/III, fermes auto ........ ~6 000 à 12 000 $/h
#   Générateurs, kits ....................... en points boutique uniquement (/boutique, 1 € = 100 points)
#   Grades ................................. jamais vendus : débloqués par les points dépensés (grade-tiers)
#   Le marché dynamique freine ceux qui farment UN seul produit : varier ses farms rapporte plus.
#   Revendre = 80 % maximum du prix d'achat, bonus compris : l'argent ne se crée qu'en farmant.

