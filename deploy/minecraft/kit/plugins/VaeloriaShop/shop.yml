# Grades : ils ne s'achètent PAS. Chaque point boutique dépensé (kits, spawners) compte, et le grade tombe
# tout seul au palier (spent = points dépensés au total, 1 € = 100 points). Commande : points.grade-command.
# La clé est le nom du groupe LuckPerms ; chaque grade doit hériter du précédent.
grade-tiers:
  guerrier:  { spent: 1000, name: "<#C9CDD5>Guerrier" }
  seigneur:  { spent: 2500, name: "<#D9DCE2>Seigneur" }
  roi:       { spent: 5000, name: "<#E2C27F>Roi" }
  vaelorian: { spent: 8000, name: "<gradient:#FFFFFF:#D9DCE2>VÆLORIAN</gradient>" }

# Packs de points vendus sur le site (1 € = 100 points). Lu par le site et par l'API de paiement.
points-packs: [500, 1000, 2500, 5000, 8000]
