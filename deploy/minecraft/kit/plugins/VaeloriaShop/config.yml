# ╔══════════════════════════════════════════════════════════════╗
# ║                  VæloriaShop — configuration                 ║
# ║   Boutique, marché dynamique et rangs de marchand (Farm2Win) ║
# ╚══════════════════════════════════════════════════════════════╝
# Les articles et leurs prix sont dans shop.yml. Après modification : /shop admin reload
# Textes au format MiniMessage, avec les couleurs du logo : <ruby> <ruby_hi> <ruby_lo> <snow> <silver>
# <steel> <ash> <graphite>, plus <gain> (hausse) et <loss> (baisse).

currency-symbol: "$"

# Achats au-dessus de ce total : Maj+clic ouvre l'écran de confirmation au lieu d'acheter directement.
confirm-above: 25000

autosave-minutes: 5

# ── Marché dynamique ──────────────────────────────────────────────
# Chaque vente fait baisser un peu le prix de RACHAT de l'article pour tout le serveur. La baisse s'efface
# toute seule avec le temps. Résultat : inonder le marché d'un seul produit rapporte de moins en moins, varier
# ses farms rapporte plus. C'est le frein anti-inflation d'un Farm2Win.
market:
  enabled: true
  # Temps pour que la baisse d'un article se résorbe de moitié.
  half-life-hours: 8
  # Baisse maximale du prix de rachat (jamais sous 50 % du prix de base).
  max-drop-percent: 50
  # Valeur vendue (au prix de base) par le serveur pour atteindre ~63 % de la baisse maximale.
  # Réglable article par article dans shop.yml (champ saturation).
  saturation: 150000
  # Le seuil grandit avec le nombre de joueurs connectés au-delà de cette référence (40 joueurs = seuil × 2).
  reference-players: 20
  # Un article racheté ne dépasse jamais ce pourcentage de son prix d'achat, bonus compris : aucune boucle
  # « acheter pour revendre » n'est possible.
  max-sell-ratio-percent: 80
  timezone: "Europe/Paris"
  # Cours du jour : quelques articles tirés au sort chaque jour à minuit, rachetés plus cher.
  featured:
    count: 3
    bonus-percent: 25

# ── Rangs de marchand ─────────────────────────────────────────────
# On monte en VENDANT au marché (total gagné depuis toujours). Chaque rang débloque des articles (champ level de
# shop.yml) et ajoute un bonus sur toutes les ventes. Dans l'ordre des seuils ; le premier vaut 0.
ranks:
  colporteur:
    name: "<steel>Colporteur"
    threshold: 0
    bonus-percent: 0
    icon: LEATHER
    perks:
      - "<ash>Houe de moisson I, graines, blocs"
  marchand:
    name: "<silver>Marchand"
    threshold: 20000
    bonus-percent: 2
    icon: IRON_INGOT
    perks:
      - "<ash>Houe II, hache du bûcheron"
      - "<ash>Baguette de vente, livres enchantés"
  negociant:
    name: "<#E2C27F>Négociant"
    threshold: 120000
    bonus-percent: 4
    icon: GOLD_INGOT
    perks:
      - "<ash>Pioche des abysses, obsidienne"
      - "<ash>Livres Tranchant, Fortune, Butin"
  maitre:
    name: "<ruby_hi>Maître marchand"
    threshold: 500000
    bonus-percent: 6
    icon: DIAMOND
    perks:
      - "<ash>Houe III, Raccommodage, boîte de Shulker"
  baron:
    name: "<ruby_hi><b>Baron du négoce"
    threshold: 2000000
    bonus-percent: 8
    icon: EMERALD
    perks:
      - "<ash>Bonus de vente +8 %, 8 annonces HDV"
  prince:
    name: "<gradient:#D21F2F:#E2C27F><b>Prince marchand</gradient>"
    threshold: 7500000
    bonus-percent: 10
    icon: NETHER_STAR
    perks:
      - "<ash>Le titre suprême du commerce."

# Annonce à tout le serveur à partir de ce rang.
ranks-broadcast-from: 4

# ── Outils de Vaeloria ────────────────────────────────────────────
# Types : HARVEST_HOE (radius 0 = 1×1, 1 = 3×3, 2 = 5×5), MINER_PICKAXE (radius 1 = 3×3, blocs naturels),
# TIMBER_AXE (max-blocks), SELL_WAND (uses). Tous respectent les claims : un bloc protégé n'est jamais touché.
tools:
  houe-moisson-1:
    type: HARVEST_HOE
    material: IRON_HOE
    name: "<silver>Houe de moisson <ruby_hi>I"
    radius: 0
    auto-pickup: true
    lore:
      - "<ash>Récolte et <snow>replante</snow> tout seul."
      - "<ash>La récolte va directement dans ton sac."
      - "<ash>Ne casse jamais une pousse pas mûre."
  houe-moisson-2:
    type: HARVEST_HOE
    material: DIAMOND_HOE
    name: "<silver>Houe de moisson <ruby_hi>II"
    radius: 1
    lore:
      - "<ash>Récolte et replante en <snow>3×3</snow>."
      - "<ash>Clic droit ou clic gauche sur une culture mûre."
  houe-moisson-3:
    type: HARVEST_HOE
    material: NETHERITE_HOE
    name: "<gradient:#D21F2F:#E2C27F>Houe de moisson III</gradient>"
    radius: 2
    lore:
      - "<ash>Récolte et replante en <snow>5×5</snow>."
      - "<ash>L'outil des grands domaines agricoles."
  hache-bucheron:
    type: TIMBER_AXE
    material: DIAMOND_AXE
    name: "<silver>Hache du bûcheron"
    max-blocks: 96
    enchantments: { efficiency: 4 }
    lore:
      - "<ash>Abat l'<snow>arbre entier</snow> d'un coup."
      - "<ash>Accroupi : une seule bûche."
  pioche-abysses:
    type: MINER_PICKAXE
    material: DIAMOND_PICKAXE
    name: "<ruby_hi>Pioche des abysses"
    radius: 1
    enchantments: { efficiency: 5, fortune: 2 }
    lore:
      - "<ash>Mine en <snow>3×3</snow> la pierre, la terre"
      - "<ash>et les minerais (jamais les constructions)."
      - "<ash>Accroupi : un seul bloc."
  baguette-vente-100:
    type: SELL_WAND
    material: BLAZE_ROD
    name: "<#E2C27F>Baguette de vente"
    uses: 100
    lore:
      - "<ash>Clic droit sur un coffre : vend tout"
      - "<ash>ce qui est rachetable dedans."
  baguette-vente-500:
    type: SELL_WAND
    material: BLAZE_ROD
    name: "<gradient:#E2C27F:#D21F2F>Grande baguette de vente</gradient>"
    uses: 500
    lore:
      - "<ash>Clic droit sur un coffre : vend tout"
      - "<ash>ce qui est rachetable dedans."

# ── Hôtel des ventes (/hdv) ───────────────────────────────────────
# Annonces à prix fixe entre joueurs. Chaque objet affiche un PRIX CONSEILLÉ calculé d'après le serveur :
# médiane des ventes récentes à l'HDV, sinon prix de la boutique −10 %, sinon rachat du marché +50 %.
# Les frais et la taxe sont détruits : un puits d'argent qui freine l'inflation.
hdv:
  enabled: true
  duration-hours: 48              # ensuite l'objet part à l'entrepôt du vendeur
  listing-fee-percent: 1          # payé à la mise en vente, non remboursé
  listing-fee-min: 10
  sale-tax-percent: 5             # prélevé sur le vendeur à la vente
  tax-discount-per-rank: 0.5      # -0,5 point par rang de marchand (Prince marchand : 2,5 %)
  # Annonces simultanées selon le rang de marchand (I → VI). Permission vaeloria.hdv.listings.<n> pour plus.
  max-listings-by-rank: [3, 4, 5, 6, 8, 10]
  min-price: 1
  max-price: 1000000000
  warn-above-ratio: 5             # au-delà de 5× le prix conseillé : confirmation demandée
  broadcast-above: 250000         # annonce à tout le serveur (cliquable) ; 0 = jamais
  reference-days: 7               # ventes prises en compte pour le prix conseillé
  reference-min-sales: 3          # ventes minimum avant de suivre la médiane de l'HDV
  history-size: 500
  blacklist: [BEDROCK, BARRIER, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK, STRUCTURE_BLOCK, JIGSAW, LIGHT, DEBUG_STICK, KNOWLEDGE_BOOK, END_PORTAL_FRAME, SPAWNER_MINECART, COMMAND_BLOCK_MINECART]

# ── Points boutique (/boutique, /points) ──────────────────────────
# Monnaie achetée sur le site (1 € = 100 points). Les catégories « premium: true » de shop.yml (kits, spawners)
# ne se paient QU'EN POINTS et n'apparaissent plus dans le marché en $. Les GRADES ne s'achètent pas : ils se
# débloquent selon le total de points dépensés (shop.yml → grade-tiers).
# Crédit après paiement : le site envoie, via VaeloriaBridge, la commande console
#   points give <uuid ou pseudo> <points> [référence de commande]
# Chaque mouvement est écrit dans plugins/VaeloriaShop/data/points.log (à conserver : argent réel).
points:
  store-url: "https://vaeloria.fr/boutique"
  rate-text: "1 € = 100 points"
  # Grade débloqué (palier atteint) : {player} {uuid} {grade} {permission}. Possession vérifiée par group.<grade>,
  # vraie aussi pour les grades qui en héritent. Rattrapé à chaque connexion si LuckPerms était indisponible.
  grade-command: "lp user {player} parent add {grade}"

# ── Kits (catégorie « kits » de shop.yml) ─────────────────────────
# On achète l'ACCÈS DÉFINITIF à un kit EssentialsX, puis la commande console ci-dessous l'accorde.
# Le contenu et le délai de chaque kit se règlent dans plugins/Essentials/kits.yml.
# {player} {uuid} {permission} {kit}. Si la commande échoue (LuckPerms absent), le joueur est remboursé.
kits:
  grant-command: "lp user {player} permission set {permission} true"

# ── Boutiques de joueurs (/pshop) ─────────────────────────────────
# Parcelles délimitées par le staff à la spawn (/pshop admin), louées à la semaine. Le locataire y construit sa
# vitrine et vend des OBJETS UNIQUES, qui ne se vendent ni au marché ni à l'hôtel des ventes.
#
# Calibrage des loyers (prix de base, avant la demande) :
#   Une pièce unique se vend ~10 000 à 150 000 $ (totem ~20 k, plastron en netherite ~50 k, élytres ~100 k).
#   Échoppe          : ~5 ventes/semaine × ~20 k  ≈ 100 k/sem → loyer 15 k  (~15 % du chiffre d'affaires)
#   Boutique         : vitrine plus grande, meilleur passage ≈ 200 k/sem → loyer 35 k
#   Grande enseigne  : emplacement central, 28 objets ≈ 300-500 k/sem → loyer 75 k
#   Une boutique active rapporte donc 5 à 7 fois son loyer ; une boutique abandonnée coûte : les places tournent.
player-shops:
  enabled: true
  max-plots: 16
  max-plots-per-player: 1
  max-volume: 32768              # blocs maximum par parcelle (32×32×32)
  max-weeks-ahead: 4             # on peut payer jusqu'à 4 semaines d'avance
  grace-hours: 48                # loyer impayé : boutique fermée 48 h, puis parcelle libérée
  warn-before-hours: 24
  sale-tax-percent: 3            # moins que l'HDV : le loyer est déjà payé
  # La demande ajuste tous les loyers : presque tout est loué → plus cher ; presque vide → moins cher.
  demand:
    enabled: true
    high-occupancy-percent: 75
    high-multiplier: 1.25
    low-occupancy-percent: 25
    low-multiplier: 0.8
  # Gammes : l'admin en attribue une à chaque parcelle selon son emplacement.
  # level = rang de marchand requis pour louer (II Marchand, III Négociant, IV Maître marchand).
  tiers:
    standard:
      name: "<silver>Échoppe"
      rent: 15000
      offers: 14
      level: 2
      icon: OAK_SIGN
      estimate: "80 000 à 120 000 $ / semaine"
    premium:
      name: "<#E2C27F>Boutique"
      rent: 35000
      offers: 21
      level: 3
      icon: GOLD_BLOCK
      estimate: "150 000 à 250 000 $ / semaine"
    prestige:
      name: "<ruby_hi>Grande enseigne"
      rent: 75000
      offers: 28
      level: 4
      icon: BEACON
      estimate: "300 000 à 500 000 $ / semaine"
  # Ce qui compte comme objet unique.
  unique:
    only-in-player-shops: true   # refusés à l'hôtel des ventes
    renamed-items: true          # toute pièce renommée à l'enclume
    trimmed-armor: true          # armures ornées (gabarits d'ornement)
    decorated-banners: true      # bannières à motifs
    materials: [ELYTRA, TOTEM_OF_UNDYING, DRAGON_EGG, DRAGON_HEAD, NETHER_STAR, BEACON, CONDUIT, HEART_OF_THE_SEA,
      TRIDENT, MACE, HEAVY_CORE, ENCHANTED_GOLDEN_APPLE, NETHERITE_SWORD, NETHERITE_AXE, NETHERITE_PICKAXE,
      NETHERITE_SHOVEL, NETHERITE_HOE, NETHERITE_HELMET, NETHERITE_CHESTPLATE, NETHERITE_LEGGINGS, NETHERITE_BOOTS,
      NETHERITE_BLOCK, PLAYER_HEAD, WITHER_SKELETON_SKULL, SKELETON_SKULL, ZOMBIE_HEAD, CREEPER_HEAD, PIGLIN_HEAD,
      SHULKER_SHELL, SNIFFER_EGG, RECOVERY_COMPASS, WRITTEN_BOOK, GOAT_HORN]
    name-starts-with: [MUSIC_DISC_]
    name-ends-with: [_SMITHING_TEMPLATE, _POTTERY_SHERD, _BANNER_PATTERN]
  # ── Spécialités : une par parcelle (la parcelle n reçoit la n-ième, modifiable dans /pshop admin) ──
  # Un objet de la spécialité vendu dans CETTE boutique rapporte un bonus au vendeur, même enchanté, abîmé ou
  # renommé. Le bonus est versé en plus du prix payé par l'acheteur (argent créé : 15 % reste modéré).
  # specialty-items-allowed : ces objets peuvent être exposés dans la boutique même s'ils ne sont pas uniques
  # (un arc enchanté n'est pas une pièce unique, mais il a sa place chez l'armurier des arcs).
  specialty-bonus-percent: 15
  specialty-items-allowed: true
  specialties:
    arcs:
      name: "<#C9A36B>Arcs & arbalètes"
      icon: BOW
      materials: [BOW, CROSSBOW]
      description: ["<ash>Arcs, arbalètes, enchantés ou non."]
    epees:
      name: "<silver>Épées"
      icon: DIAMOND_SWORD
      name-ends-with: [_SWORD]
      description: ["<ash>Toutes les épées, du bois à la netherite."]
    haches:
      name: "<silver>Haches"
      icon: DIAMOND_AXE
      name-ends-with: [_AXE]
      materials: [MACE]
      description: ["<ash>Haches et masses de guerre."]
    casques:
      name: "<steel>Casques"
      icon: DIAMOND_HELMET
      name-ends-with: [_HELMET]
      description: ["<ash>Casques de toutes matières."]
    plastrons:
