      icon: DIAMOND_PICKAXE
      name-ends-with: [_PICKAXE, _SHOVEL]
      description: ["<ash>L'outillage du mineur."]
    outils-terre:
      name: "<gain>Outils de la terre"
      icon: DIAMOND_HOE
      name-ends-with: [_HOE]
      materials: [SHEARS, FISHING_ROD, BRUSH]
      description: ["<ash>Houes, cisailles, cannes à pêche, pinceaux."]
    livres:
      name: "<#B48CFF>Livres enchantés"
      icon: ENCHANTED_BOOK
      materials: [ENCHANTED_BOOK]
      description: ["<ash>Tous les livres enchantés."]
    potions:
      name: "<#E07FB0>Potions & flèches"
      icon: SPLASH_POTION
