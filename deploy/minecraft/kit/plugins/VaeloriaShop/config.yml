# ── Investissement AFK (/invest) ──────────────────────────────────
# Le joueur place de l'argent ; il rapporte des intérêts SEULEMENT quand il est connecté dans une zone
# d'investissement (délimitée avec /invest admin). Calibrage « pas trop abusé » :
#   0,25 %/h × 8 h comptées par jour = 2 % par jour au plus, intérêts non composés.
#   Colporteur (50 k placés)   : ≤ 1 000 $/jour   (8 h de farm actif : ~15 000 $)
#   Négociant (300 k placés)   : ≤ 6 000 $/jour
#   Prince marchand (2 M)      : ≤ 40 000 $/jour
#   Au-delà de soft-cap investis sur tout le serveur, le taux baisse pour tous (soft-cap / total investi),
#   sans descendre sous min-rate-factor × le taux : plus le serveur est riche, moins l'AFK rapporte.
invest:
  enabled: true
  hourly-rate-percent: 0.25
  max-hours-per-day: 8
  soft-cap: 20000000
  min-rate-factor: 0.25
  min-deposit: 1000
  withdraw-fee-percent: 1         # retirer le capital coûte 1 % (argent détruit)
  # Capital maximum selon le rang de marchand (I → VI).
  max-deposit-by-rank: [50000, 150000, 300000, 600000, 1000000, 2000000]

# ── Remontée vers le site (VaeloriaBridge) ────────────────────────
# Envoie SHOP_PURCHASE (achats ≥ min-purchase) et MERCHANT_RANK au site. À activer seulement quand l'API
# connaît ces deux types d'événements.
bridge:
  enabled: true   # API workers.dev : accepte POINTS, SHOP_PURCHASE, MERCHANT_RANK (progression sur /boutique)
  min-purchase: 50000

