# VaeloriaTab — TAB, chat, annonces et écran Multijoueur aux couleurs du logo VÆLORIA.
# Format : MiniMessage (https://docs.advntr.dev/minimessage/format.html).
#
# Couleurs de la charte, utilisables comme balises : <ruby>, <ruby_hi>, <ruby_lo>,
# <silver>, <steel>, <ash>, <graphite>, <snow>.
# Variables du TAB : <logo> (wordmark animé), <player>, <rank>, <online>, <max>, <ping>, <tps>,
# <server>, <world>, et les couleurs dynamiques <ping_color>, <tps_color>.

# Nom du serveur dans le réseau, affiché dans le pied de page.
server-name: "Factions"

# Fréquence de rafraîchissement de l'en-tête (ticks, 20 = 1 s). Pilote la vitesse du reflet.
refresh-ticks: 3
# Fréquence de recalcul des grades dans la liste (ticks).
names-refresh-ticks: 40

# Charte du logo (brand/build.py).
palette:
  ruby: "#A3121E"
  ruby_hi: "#D21F2F"
  ruby_lo: "#5E0710"
  snow: "#FFFFFF"
  silver: "#D9DCE2"
  steel: "#A9AEB8"
  ash: "#6E737E"
  graphite: "#2A2C33"

# Wordmark : lettres argent avec un reflet qui balaie le nom, l'Æ en rubis comme sur le logo.
logo:
  text: "V Æ L O R I A"
  accent: "Æ"
  accent-color: "#D21F2F"
  base-color: "#A9AEB8"
  shine-color: "#FFFFFF"
  # Largeur du reflet (en caractères) et pause entre deux passages (en images).
  shine-width: 3
  pause-frames: 18
  bold: true

header:
  - ""
  - "<ruby_lo>▬▬▬▬▬▬▬▬▬▬<ruby>▬▬▬ <ruby_hi>◆</ruby_hi> ▬▬▬<ruby_lo>▬▬▬▬▬▬▬▬▬▬"
  - ""
  - "<logo>"
  - "<ash>LE RETOUR DE LA <ruby_hi><bold>VRAIE GUERRE</bold></ruby_hi>."
  - ""

footer:
  - ""
  - "<ash>Joueurs <snow><online></snow><steel>/<max></steel>  <ruby>◆</ruby>  Ping <ping_color><ping>ms</ping_color>  <ruby>◆</ruby>  TPS <tps_color><tps></tps_color>"
  - "<ash>Serveur <silver><server></silver>  <ruby>◆</ruby>  Grade <rank>"
  - ""
  - "<ruby_hi>vaeloria.fr</ruby_hi> <graphite>│</graphite> <silver>/link</silver> <ash>pour lier ton compte"
  - "<ruby_lo>▬▬▬▬▬▬▬▬▬▬<ruby>▬▬▬▬▬▬▬▬▬▬▬▬▬▬<ruby_lo>▬▬▬▬▬▬▬▬▬▬"

# Couleurs du ping (ms) et du TPS selon les seuils.
ping:
  good-below: 80
  medium-below: 180
  good: "#E6E8EC"
  medium: "#A9AEB8"
  bad: "#D21F2F"
tps:
  good-above: 19.0
  medium-above: 16.0
  good: "#E6E8EC"
  medium: "#A9AEB8"
  bad: "#D21F2F"

# Grades : TAB, chat et annonces. Le grade retenu est celui d'« order » le plus élevé dont
# le joueur a la permission (à donner via LuckPerms, ex. /lp user TonPseudo permission set vaeloria.rank.fondateur).
# Les permissions sont créées par défaut à false : un op n'en hérite pas automatiquement.
# « order » trie aussi la liste : plus il est élevé, plus le joueur apparaît haut.
# « default » (sans permission) s'applique à tous les autres joueurs.
#   display : nom du grade (<rank>)          format : nom dans le TAB (<tab_name>)
#   chat / join / quit (facultatifs) : remplacent les formats communs des sections chat et join-quit.
ranks:
  fondateur:
    permission: "vaeloria.rank.fondateur"
    order: 100
    display: "<ruby_hi><bold>FONDATEUR</bold></ruby_hi>"
    format: "<ruby_hi><bold>FONDATEUR</bold></ruby_hi> <graphite>│</graphite> <snow><player>"
    chat: "<name> <ruby_hi>»</ruby_hi> <snow><message>"
    join: "<ruby_hi>⚔</ruby_hi> <ruby_hi><bold>Le Fondateur</bold></ruby_hi> <snow><player></snow> <ash>entre dans la bataille."
  admin:
    permission: "vaeloria.rank.admin"
    order: 90
    display: "<ruby_hi>ADMIN</ruby_hi>"
    format: "<ruby_hi>ADMIN</ruby_hi> <graphite>│</graphite> <snow><player>"
    chat: "<name> <ruby>»</ruby> <snow><message>"
  moderateur:
    permission: "vaeloria.rank.moderateur"
    order: 80
    display: "<ruby>MODÉRATEUR</ruby>"
    format: "<ruby>MODO</ruby> <graphite>│</graphite> <silver><player>"
    chat: "<name> <ruby>»</ruby> <snow><message>"
  vaelorian:
    permission: "group.vaelorian"
    order: 50
    display: "<gradient:#FFFFFF:#A9AEB8>VÆLORIAN</gradient>"
    format: "<gradient:#FFFFFF:#A9AEB8>VÆLORIAN</gradient> <ruby_hi>◆</ruby_hi> <silver><player>"
    join: "<ruby_hi>◆</ruby_hi> <tab_name> <ash>rejoint le front."
  # Grades achetés en boutique : permission « group.<grade> », donnée par LuckPerms aux membres du groupe
  # (/lp user Pseudo parent add roi). Un grade supérieur hérite des inférieurs : le plus haut « order » l'emporte.
  roi:
    permission: "group.roi"
    order: 40
    display: "<#E2C27F>Roi</#E2C27F>"
    format: "<#E2C27F><bold>ROI</bold></#E2C27F> <graphite>│</graphite> <snow><player>"
    compact: "<#E2C27F>♛</#E2C27F> <snow><player>"
    join: "<#E2C27F>♛</#E2C27F> <tab_name> <ash>entre dans le royaume."
  seigneur:
    permission: "group.seigneur"
    order: 30
    display: "<silver>Seigneur</silver>"
    format: "<silver><bold>SEIGNEUR</bold></silver> <graphite>│</graphite> <silver><player>"
    compact: "<silver><bold>S</bold></silver> <silver><player>"
  guerrier:
    permission: "group.guerrier"
    order: 20
    display: "<#C9CDD5>Guerrier</#C9CDD5>"
    format: "<#C9CDD5>GUERRIER</#C9CDD5> <graphite>│</graphite> <silver><player>"
    compact: "<#C9CDD5>G</#C9CDD5> <silver><player>"
  default:
    permission: ""
    order: 0
    display: "<steel>Joueur</steel>"
    format: "<steel><player>"
    chat: "<name> <graphite>»</graphite> <steel><message>"

# ─────────────────────────────────────────────────────────────────────────────
# Chat : chaque message est précédé du nom du joueur au format de son grade.
# Variables : <name> (nom au format du grade, survol + clic), <message>, <player>, <rank>,
# <server>. Le texte tapé par les joueurs n'interprète aucune balise.
# Si EssentialsChat (ou un autre plugin de chat) est installé, le retirer ou désactiver son format.
# ─────────────────────────────────────────────────────────────────────────────
chat:
  enabled: true
  # Format des grades sans « chat » propre.
  format: "<name> <graphite>»</graphite> <silver><message>"
  # Bulle au survol du nom, et commande proposée au clic (vide = aucune).
  hover: "<rank>\n<ash>Serveur <silver><server></silver>\n\n<ash>Clique pour lui écrire"
  click: "/msg <player> "

# ─────────────────────────────────────────────────────────────────────────────
# Connexion / déconnexion. Désactiver ceux d'Essentials : custom-join-message: "" et
# custom-quit-message: "" dans plugins/Essentials/config.yml, et vider motd.txt.
# Variables : <tab_name>, <player>, <rank>, <online>, <server> ; <unique> pour first-join.
# Format vide = pas d'annonce. Joueurs en vanish et permission silent-permission : aucune annonce.
# ─────────────────────────────────────────────────────────────────────────────
join-quit:
  enabled: true
  join: "<graphite>[<ruby_hi>+</ruby_hi>]</graphite> <tab_name>"
  quit: "<graphite>[<ruby_lo>-</ruby_lo>]</graphite> <tab_name>"
  # Toute première connexion du joueur, annoncée à tous.
  first-join: "<ruby_hi>◆</ruby_hi> <snow><bold>BIENVENUE</bold></snow> <ash>à</ash> <silver><player></silver><ash>, <silver><unique></silver><ash>e guerrier de <silver><bold>VÆLORIA</bold></silver><ash> !"
  silent-permission: "vaeloria.join.silent"
  # Message privé envoyé au joueur à chaque connexion.
  welcome:
    - "<ruby_lo>▬▬▬▬▬▬▬▬▬▬<ruby>▬▬▬▬ <ruby_hi>◆</ruby_hi> ▬▬▬▬<ruby_lo>▬▬▬▬▬▬▬▬▬▬"
    - "<silver><bold>             V Æ L O R I A"
    - "<ash>     Le retour de la <ruby_hi><bold>vraie guerre</bold></ruby_hi>."
    - ""
    - "<ash>  Bienvenue <snow><player></snow>, tu es <rank><ash>."
    - "<ash>  <silver><online></silver> joueurs en ligne sur <silver><server></silver>."
    - "<ash>  Site, boutique, classements : <click:open_url:'https://vaeloria.fr'><hover:show_text:'<ash>Ouvrir vaeloria.fr'><ruby_hi><u>vaeloria.fr</u></ruby_hi></hover></click>"
    - "<ash>  Lie ton compte au site : <click:run_command:'/link'><hover:show_text:'<ash>Cliquer pour obtenir ton code'><silver>/link</silver></hover></click>"
    - "<ruby_lo>▬▬▬▬▬▬▬▬▬▬<ruby>▬▬▬▬▬▬▬▬▬▬▬▬<ruby_lo>▬▬▬▬▬▬▬▬▬▬"

# ─────────────────────────────────────────────────────────────────────────────
# Écran Multijoueur (liste des serveurs)
# Variables : <logo>, <online>, <max>, <server> et les couleurs de la palette.
# Icône : celle du logo (brand/server-icon.png) est embarquée ; pour la remplacer,
# déposer un PNG 64×64 nommé server-icon.png dans plugins/VaeloriaTab/.
# ─────────────────────────────────────────────────────────────────────────────
server-list:
  enabled: true

  motd:
    # Chaque ligne doit tenir sur ~270 px (environ 45 caractères), sinon elle est coupée.
    # Centre chaque ligne au pixel près (police Minecraft par défaut).
    center: true
    line1: "<ruby_hi>◆</ruby_hi>   <logo>   <ruby_hi>◆</ruby_hi>"
    # Messages de la 2e ligne, en rotation.
    rotate-seconds: 8
    line2:
      - "<ash>LE RETOUR DE LA <ruby_hi><bold>VRAIE GUERRE</bold></ruby_hi>."
      - "<silver>Faction <ruby>◆</ruby> PvP 1.8 <ruby>◆</ruby> Guerres d'empires"
      - "<ash>Boutique et classements sur <ruby_hi>vaeloria.fr"

  # Bulle affichée au survol du compteur de joueurs.
  # Texte « § » côté client : seules les 16 couleurs Minecraft passent. Les gris de la charte
  # seraient convertis en bleu, d'où <white>, <gray>, <dark_gray> et <dark_red> (rubis) ici.
  hover:
    lines:
      - ""
      - "  <dark_red>◆</dark_red> <white><bold>VÆLORIA</bold></white> <dark_red>◆</dark_red>"
      - "  <gray>Faction & PvP — Minecraft 1.21"
      - ""
      - "  <gray>En ligne : <white><online></white><dark_gray>/<max>"
      - "  <gray>Site : <dark_red>vaeloria.fr"
      - "  <gray>Lier ton compte : <white>/link"
      - ""
    # Ajoute quelques joueurs connectés sous les lignes (respecte hide-online-players du serveur).
    show-players: true
    max-players: 8

  # Texte de version montré aux clients d'une version incompatible.
  # Même contrainte que la bulle : 16 couleurs Minecraft.
  version-text: "<dark_red>VÆLORIA</dark_red> <gray>1.21+"
  # Capacité affichée (-1 = celle de server.properties).
  max-players: -1

  # Maintenance : MOTD dédié, « Maintenance » à la place du compteur, connexions refusées
  # sauf pour la permission vaeloria.maintenance.bypass. Plus simple : /staff → Ouverture du serveur
  # (ou /vtab phase maintenance). « enabled: true » ici force la maintenance quelle que soit la phase.
  maintenance:
    enabled: false
    line2: "<ruby_hi><bold>MAINTENANCE</bold></ruby_hi> <ash>· infos sur <silver>vaeloria.fr"
    version-text: "<dark_red>Maintenance"
    kick-message: "<ruby_hi>◆</ruby_hi> <snow><bold>VÆLORIA</bold></snow> <ruby_hi>◆</ruby_hi>\n\n<silver>Le serveur est en maintenance.\n<ash>Infos et retour : <ruby_hi>vaeloria.fr"

# ─────────────────────────────────────────────────────────────────────────────
# Ouverture du serveur : phases, whitelist, compte à rebours, badge du MOTD.
# Tout se règle en jeu dans /staff → « Ouverture du serveur » (ou /vtab phase|open|badge, /vwl).
# L'état (phase, date, badge, lignes modifiées en jeu) est dans opening.yml, la whitelist
# dans whitelist.yml : ne pas les modifier à la main pendant que le serveur tourne.
#
# Phases :
#   normal      : ouvert à tous (MOTD de server-list.motd ci-dessus)
#   whitelist   : bêta fermée, seuls la whitelist et vaeloria.whitelist.bypass entrent
#   countdown   : compte à rebours jusqu'à la date d'ouverture, puis passage auto en « launch »
#   launch      : ouverture officielle (annonce, feux d'artifice), retour auto en « normal »
#   maintenance : seuls vaeloria.maintenance.bypass entrent (server-list.maintenance.enabled
#                 à true force toujours cette phase, comme avant)
#
# Variables : <countdown> (« 2j 04h 12m »), <open_date> (« samedi 1 novembre à 20h00 »),
# <whitelisted> (nombre de joueurs sur la whitelist), <phase>, <server>, <online>, <max>,
# <logo> (MOTD), <player> (titre), et les couleurs de la palette.
# line2 : 2e ligne du MOTD en rotation (rotate-seconds), ~45 caractères maximum.
# version-text + replace-counter: true : le texte remplace le compteur de joueurs (rouge, 16 couleurs
#   Minecraft seulement) ; le client signale alors une version incompatible, ce qui est voulu quand
#   personne ne peut entrer. Laisser false pour la bêta, sinon les testeurs ont un avertissement.
# hover : lignes ajoutées sous la bulle du compteur (16 couleurs Minecraft seulement).
# title / subtitle / sound : à chaque connexion. bossbar : en haut de l'écran pendant toute la phase
#   (couleurs : PINK BLUE RED GREEN YELLOW PURPLE WHITE ; overlay : PROGRESS NOTCHED_6/10/12/20).
#   Texte vide = rien.
# ─────────────────────────────────────────────────────────────────────────────
opening:
  timezone: "Europe/Paris"
  # En compte à rebours, les joueurs de la whitelist (testeurs) peuvent-ils entrer ?
  countdown-whitelist-can-join: true
  # Délai avant le titre de connexion (ticks), le temps que le monde s'affiche.
  join-title-delay-ticks: 20

  # Badge devant la 2e ligne du MOTD (NOUVEAU, OUVERTURE, x2 DROP…), clignote entre les deux formats.
  badge:
    format: "<ruby_hi><bold>✦ <badge> ✦</bold></ruby_hi>"
    format-alt: "<snow><bold>✦ <badge> ✦</bold></snow>"
    blink-seconds: 1

  # Ouverture officielle : au passage en « launch » (à la main ou à la fin du compte à rebours).
  launch:
    # Durée de la phase avant le retour en « normal » (heures, 0 = jamais).
    hours: 48
    announce:
      - ""
      - "<ruby_lo>▬▬▬▬▬▬▬▬▬▬<ruby>▬▬▬▬ <ruby_hi>◆</ruby_hi> ▬▬▬▬<ruby_lo>▬▬▬▬▬▬▬▬▬▬"
      - "<snow><bold>         VÆLORIA EST OUVERT !"
      - "<ash>   La guerre commence. Bonne chance, <silver>guerriers</silver>."
      - "<ruby_lo>▬▬▬▬▬▬▬▬▬▬<ruby>▬▬▬▬▬▬▬▬▬▬▬▬<ruby_lo>▬▬▬▬▬▬▬▬▬▬"
      - ""
    sound: "ui.toast.challenge_complete"
    # Feux d'artifice (sans dégâts) sur chaque joueur connecté.
    fireworks: 3

  phases:
    normal:
      title: "<ruby_hi><bold>VÆLORIA"
      subtitle: "<ash>Le retour de la <ruby_hi>vraie guerre</ruby_hi>"
      sound: "entity.ender_dragon.growl"
      bossbar:
        text: ""

    whitelist:
      line2:
        - "<ruby_hi><bold>BÊTA FERMÉE</bold></ruby_hi> <ash>· whitelist sur <silver>vaeloria.fr"
        - "<ash>Ouverture <silver><open_date>"
      version-text: "<dark_red>Bêta fermée"
      replace-counter: false
      hover:
        - "  <dark_red>◆</dark_red> <white>Bêta fermée</white> <gray>: sur whitelist"
        - "  <gray>Ouverture : <white><open_date>"
        - ""
      kick-message: "<ruby_hi>◆</ruby_hi> <snow><bold>VÆLORIA</bold></snow> <ruby_hi>◆</ruby_hi>\n\n<silver>Le serveur est en <ruby_hi><bold>bêta fermée</bold></ruby_hi>.\n<ash>Tu n'es pas encore sur la whitelist.\n\n<ash>Ouverture : <snow><open_date></snow>\n<ash>Infos : <ruby_hi>vaeloria.fr"
      title: "<ruby_hi><bold>BÊTA FERMÉE"
      subtitle: "<ash>Merci de tester <silver>VÆLORIA</silver> en avant-première"
      sound: "block.beacon.activate"
      bossbar:
        text: "<ruby_hi><bold>BÊTA FERMÉE</bold></ruby_hi> <graphite>·</graphite> <silver>Signale les bugs au staff</silver>"
        color: RED
        overlay: PROGRESS

    countdown:
      line2:
        - "<ash>OUVERTURE DANS <ruby_hi><bold><countdown></bold></ruby_hi>"
        - "<silver><open_date> <ruby>◆</ruby> <ash>vaeloria.fr"
      version-text: "<dark_red>Ouverture dans <countdown>"
      replace-counter: true
      hover:
        - "  <gray>Ouverture : <white><open_date>"
        - "  <gray>Dans : <dark_red><countdown>"
        - ""
      kick-message: "<ruby_hi>◆</ruby_hi> <snow><bold>VÆLORIA</bold></snow> <ruby_hi>◆</ruby_hi>\n\n<silver>Ouverture dans <ruby_hi><bold><countdown></bold></ruby_hi>\n<ash><open_date>\n\n<ash>Prépare-toi, la guerre arrive.\n<ash>Infos : <ruby_hi>vaeloria.fr"
      title: "<ruby_hi><bold><countdown>"
      subtitle: "<ash>avant l'ouverture de <silver>VÆLORIA"
      sound: "block.note_block.bell"
      bossbar:
        text: "<ash>Ouverture dans <ruby_hi><bold><countdown></bold></ruby_hi> <graphite>·</graphite> <silver><open_date>"
        color: RED
        overlay: NOTCHED_20

    launch:
      line2:
        - "<ruby_hi><bold>OUVERTURE OFFICIELLE</bold></ruby_hi> <ash>· rejoins la guerre"
        - "<silver>Faction <ruby>◆</ruby> PvP 1.8 <ruby>◆</ruby> Tout est à prendre"
      hover:
        - "  <dark_red>◆</dark_red> <white>OUVERTURE OFFICIELLE</white>"
        - ""
      title: "<ruby_hi><bold>OUVERTURE !"
      subtitle: "<ash>Bienvenue sur <silver>VÆLORIA</silver>, <snow><player>"
      sound: "ui.toast.challenge_complete"
      bossbar:
        text: "<ruby_hi><bold>✦ OUVERTURE OFFICIELLE ✦</bold></ruby_hi> <graphite>·</graphite> <silver>Bienvenue sur VÆLORIA"
        color: RED
        overlay: PROGRESS

    # Les textes du MOTD et du refus viennent de server-list.maintenance (ci-dessus).
    maintenance:
      title: "<ruby_hi><bold>MAINTENANCE"
      subtitle: "<ash>Seul le staff est connecté"
      bossbar:
        text: "<ruby_hi><bold>MAINTENANCE</bold></ruby_hi> <graphite>·</graphite> <ash>serveur fermé aux joueurs"
        color: RED
        overlay: PROGRESS
