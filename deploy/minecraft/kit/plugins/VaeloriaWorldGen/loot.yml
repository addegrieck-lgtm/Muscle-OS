# VaeloriaWorldGen — tables de loot des coffres de structures.
# Rechargement à chaud : /vgen reload   ·   Aperçu d'un tirage : /vgen loot <table>
#
# rolls   : nombre de piles tirées par coffre (ex. "4-7")
# item    : identifiant Minecraft (diamond, golden_apple, splash_potion...)
# amount  : quantité, fixe ou intervalle ("2-6")
# weight  : poids relatif dans la table
# enchants: { sharpness: 1-3, unbreaking: 2 }  (sur un enchanted_book = enchantement stocké)
# potion  : type de potion (healing, strong_healing, swiftness, strong_strength, fire_resistance...)
# name / lore : texte MiniMessage, ex. "<#D21F2F>Lame des Anciens"
#
# Coffres : donjon_classique (donjons 1.8 des grottes), ruines (+ ruines_cachette sous l'autel), donjon (+ donjon_tresor),
#           tour_etage, tour_sommet, camp (coffres des tentes et tonneau).
# Nether : forteresse_nether (+ forteresse_tresor sur le toit), sanctuaire_rubis, ossuaire.
# Un coffre est rempli UNE fois, à sa première ouverture (ou s'il est cassé / explosé avant).

