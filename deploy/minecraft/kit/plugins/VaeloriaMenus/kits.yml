# Présentation des kits EssentialsX dans le menu /kit (clés = noms des kits de plugins/Essentials/kits.yml).
# icone, nom (MiniMessage), description (lignes), ordre (petit = en haut), texte-verrou, cache: true pour le retirer.
# Sans entrée ici, un kit prend l'icône de son premier objet. Modifiable en jeu avec /vkit.

depart:
  cache: true

# ── Kits de grade ──
joueur:
  icone: STONE_SWORD
  nom: "<silver><bold>Kit Joueur"
  description: ["Le kit de base, pour tout le monde."]
  ordre: 10
guerrier:
  icone: CHAINMAIL_CHESTPLATE
  nom: "<#9AA4B2><bold>Kit Guerrier"
  description: ["Armure en mailles, épée et pioche en fer."]
  ordre: 11
  texte-verrou: "Réservé au grade Guerrier"
seigneur:
  icone: IRON_CHESTPLATE
  nom: "<#D9DCE2><bold>Kit Seigneur"
  description: ["Armure complète en fer, arc et flèches."]
  ordre: 12
  texte-verrou: "Réservé au grade Seigneur"
roi:
  icone: GOLDEN_HELMET
  nom: "<#E2C27F><bold>Kit Roi"
  description: ["L'équipement des têtes couronnées."]
  ordre: 13
  texte-verrou: "Réservé au grade Roi"
vaelorian:
  icone: DIAMOND_CHESTPLATE
  nom: "<ruby><bold>Kit VÆLORIAN"
  description: ["Full diamant, le plus haut grade."]
  ordre: 14
  texte-verrou: "Réservé au grade VÆLORIAN"

# ── Kits de la /boutique ──
minerais:
  icone: DIAMOND_PICKAXE
