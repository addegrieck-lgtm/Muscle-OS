# VÆLORIA — server.properties (extrait : seules les clés qui comptent pour la performance et le PvP).
# Fusionner dans le server.properties généré par Paper, ne pas remplacer le fichier entier.

# Distance d'affichage envoyée au client. 8 = bon compromis Faction (voir loin en PvP sans exploser la bande passante).
view-distance=8
# Distance à laquelle les entités/redstone/cultures sont simulées. Le PvP n'en dépend pas, les fermes oui.
simulation-distance=5
# Écritures de chunks asynchrones (évite les à-coups lors des sauvegardes).
sync-chunk-writes=false
# epoll sous Linux (moins de CPU réseau).
use-native-transport=true
# 256 en accès direct. Derrière Velocity : -1 (c'est le proxy qui compresse, ne pas compresser deux fois).
network-compression-threshold=256
# Ne JAMAIS baisser en PvP : un joueur doit voir son adversaire arriver de loin.
entity-broadcast-range-percentage=100
# Pas de kick sur paquets « trop rapides » des clients PvP (l'anticheat s'en charge).
rate-limit=0
# Mode online obligatoire hors proxy. Derrière Velocity : false + forwarding moderne (voir velocity.toml).
online-mode=true
