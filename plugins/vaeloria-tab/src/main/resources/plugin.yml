name: VaeloriaTab
version: '${version}'
main: fr.vaeloria.tab.VaeloriaTabPlugin
api-version: '1.21'
description: TAB, chat, annonces et écran Multijoueur aux couleurs du logo VÆLORIA.
authors: [VÆLORIA]
# Chargé après VæloriaFactions quand il est présent (tag de faction devant le format de chat).
softdepend: [VaeloriaFactions]
commands:
  vtab:
    description: Recharger la configuration du TAB VÆLORIA
    usage: /vtab reload
    permission: vaeloria.tab.admin
permissions:
  vaeloria.tab.admin:
    default: op
  vaeloria.join.silent:
    description: Connexion et déconnexion sans annonce
    default: false
  vaeloria.maintenance.bypass:
    description: Se connecter pendant la maintenance
    default: op
