# ╔══════════════════════════════════════════════════════════════╗
# ║               VæloriaVillageois — configuration              ║
# ║   Bibliothécaires chanceux, boosts en émeraudes, œuf capture ║
# ╚══════════════════════════════════════════════════════════════╝
# Après modification : /villageois reload
#
# FONCTIONNEMENT
#   1. Les livres des bibliothécaires sont tirés dans la table « books » ci-dessous (et plus dans la table vanilla).
#   2. Accroupi + clic droit sur un bibliothécaire : menu de BOOST. Chaque boost coûte des émeraudes, relance les
#      livres que personne n'a encore achetés et ajoute 1 niveau de CHANCE au villageois (plafond : boost.max-luck).
#      Plus la chance monte, plus les livres rares (Protection IV, Tranchant V…) sortent souvent.
#      Un livre déjà acheté au moins une fois est verrouillé : il ne sera plus jamais relancé.
#   3. L'ŒUF DE CAPTURE, lancé sur un villageois, le transforme en objet pour le déplacer. Relâché, il redevient
#      un villageois sans métier : ses échanges et sa chance sont perdus, il faudra le rebooster.
#
# ÉCONOMIE EN ÉMERAUDES (repères de VaeloriaShop : débutant ~1 500 à 3 000 $/h, équipé ~6 000 à 12 000 $/h)
#   1 émeraude = 250 $ à l'achat, 100 $ à la revente (exchange ci-dessous, ou mêmes prix dans shop.yml).
#   Protection IV : 56 émeraudes = 14 000 $ (le livre Toucher de soie du shop coûte 6 000 $).
#   Boost : 6 émeraudes = 1 500 $. Pour viser un Protection IV précis : ~12 boosts en moyenne (~70 émeraudes,
#   la moitié des joueurs l'ont en 60 ou moins, 1 sur 10 dépasse 130). Total moyen ≈ 126 émeraudes ≈ 31 500 $
#   = 3 à 5 h de farm équipé : un vrai objectif, jamais un achat impulsif. N'importe quel livre rare sort
#   bien plus vite (~25 % par livre relancé dès 5 boosts).
#   /villageois chances [boosts] affiche la table réelle, calculée depuis ce fichier.

# ── Livres ──────────────────────────────────────────────────────────
# enchant : clé Minecraft (protection, sharpness, efficiency, unbreaking, fortune, silk_touch, power, looting,
#           feather_falling, depth_strider, fire_aspect, mending…). price : émeraudes (au-delà de 64 : payé en blocs
#           d'émeraude, arrondi au bloc supérieur). max-uses : achats avant réapprovisionnement.
# weight : poids sans boost. per-boost : poids ajouté par niveau de chance (négatif = le livre devient plus rare).
books:
  # Courants : disparaissent presque quand la chance monte.
  protection-2:      { enchant: protection,      level: 2, price: 12, max-uses: 6, weight: 60, per-boost: -5 }
  sharpness-2:       { enchant: sharpness,       level: 2, price: 12, max-uses: 6, weight: 60, per-boost: -5 }
  unbreaking-2:      { enchant: unbreaking,      level: 2, price: 10, max-uses: 6, weight: 60, per-boost: -5 }
  efficiency-3:      { enchant: efficiency,      level: 3, price: 12, max-uses: 6, weight: 50, per-boost: -3 }
  feather-falling-3: { enchant: feather_falling, level: 3, price: 14, max-uses: 6, weight: 40, per-boost: -2 }
  power-3:           { enchant: power,           level: 3, price: 12, max-uses: 6, weight: 40, per-boost: -2 }
  # Intermédiaires : stables.
  protection-3:      { enchant: protection,      level: 3, price: 24, max-uses: 4, weight: 25, per-boost: 0 }
  sharpness-4:       { enchant: sharpness,       level: 4, price: 28, max-uses: 4, weight: 20, per-boost: 0 }
  unbreaking-3:      { enchant: unbreaking,      level: 3, price: 24, max-uses: 4, weight: 25, per-boost: 0 }
  efficiency-4:      { enchant: efficiency,      level: 4, price: 22, max-uses: 4, weight: 20, per-boost: 0 }
  fortune-2:         { enchant: fortune,         level: 2, price: 26, max-uses: 4, weight: 15, per-boost: 0 }
  silk-touch:        { enchant: silk_touch,      level: 1, price: 20, max-uses: 3, weight: 12, per-boost: 0 }
  feather-falling-4: { enchant: feather_falling, level: 4, price: 22, max-uses: 4, weight: 15, per-boost: 1 }
  looting-2:         { enchant: looting,         level: 2, price: 24, max-uses: 4, weight: 12, per-boost: 0 }
  depth-strider-3:   { enchant: depth_strider,   level: 3, price: 26, max-uses: 4, weight: 8,  per-boost: 1 }
  # Rares : le but du boost. max-uses bas : un villageois chanceux ne devient pas une imprimerie.
  protection-4:      { enchant: protection,      level: 4, price: 56, max-uses: 2, weight: 3, per-boost: 6, announce: true }
  sharpness-5:       { enchant: sharpness,       level: 5, price: 60, max-uses: 2, weight: 2, per-boost: 5, announce: true }
  efficiency-5:      { enchant: efficiency,      level: 5, price: 40, max-uses: 2, weight: 3, per-boost: 2 }
  fortune-3:         { enchant: fortune,         level: 3, price: 48, max-uses: 2, weight: 2, per-boost: 2, announce: true }
  power-5:           { enchant: power,           level: 5, price: 48, max-uses: 2, weight: 2, per-boost: 2 }
  looting-3:         { enchant: looting,         level: 3, price: 44, max-uses: 2, weight: 2, per-boost: 2 }
  fire-aspect-2:     { enchant: fire_aspect,     level: 2, price: 36, max-uses: 2, weight: 2, per-boost: 1 }
  mending:           { enchant: mending,         level: 1, price: 64, max-uses: 1, weight: 1, per-boost: 1, announce: true }

trades:
  # true : les livres des bibliothécaires (nouveau métier, montée de niveau) viennent de la table ci-dessus.
  replace-vanilla-books: true
  # Le livre vierge reste demandé avec les émeraudes, comme en vanilla.
  require-book: true
  # Échanges où le villageois PAIE en émeraudes (blé, papier, charbon…) : quantité demandée × ce nombre (max 64).
  # Les halls de villageois sont un robinet d'émeraudes gratuit : 1.5 le ralentit sans le fermer. 1 = vanilla.
  emerald-income-multiplier: 1.5

boost:
  # Coût en émeraudes : base + step × boosts déjà payés sur ce villageois, plafonné à max.
  cost-base: 6
  cost-step: 0
  cost-max: 6
  # Au-delà, les boosts relancent toujours les livres mais n'augmentent plus la chance.
  max-luck: 10
  # Un villageois sans aucun livre en reçoit un au premier boost (jamais plus d'un ajouté ainsi).
  add-book-if-none: true

capture:
  enabled: true
  # Prix de l'œuf avec /villageois oeuf (0 = pas en vente par le plugin, à vendre dans VaeloriaShop par exemple).
  egg-price-emeralds: 24
  # L'œuf est rendu s'il rate sa cible ou si la zone est protégée.
  refund-on-miss: true

# ── Change émeraudes ↔ argent (/emeraudes), via Vault ──────────────
# Mettre enabled: false si les émeraudes sont vendues par VaeloriaShop (shop.yml), avec les mêmes prix.
exchange:
  enabled: true
  buy-price: 250      # le joueur achète 1 émeraude
  sell-price: 100     # le joueur revend 1 émeraude (bien plus bas : pas d'aller-retour rentable)
