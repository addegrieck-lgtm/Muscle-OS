name: VaeloriaBridge
version: '${version}'
main: fr.vaeloria.bridge.VaeloriaBridgePlugin
api-version: '1.21'
softdepend: [Votifier]
description: Pont sécurisé entre le serveur Minecraft VÆLORIA et l'API (événements, statut, commandes web).
authors: [VÆLORIA]
commands:
  vbridge:
    description: État du pont VæloriaBridge
    permission: vaeloria.bridge.admin
  link:
    description: Lier ton compte Minecraft à ton compte VÆLORIA (vaeloria.fr/compte)
    permission: vaeloria.link
permissions:
  vaeloria.link:
    default: true
  vaeloria.bridge.admin:
    default: op
