# VaeloriaEchanges — échanges avec les villageois, payés en ÉMERAUDES.
#
# Repère économique (voir docs/ECHANGES.md) : 1 émeraude ≈ 250 $ au /shop.
#   → le livre Toucher de soie (6 000 $ au /shop) coûte ici 22 à 26 émeraudes : les deux marchés restent cohérents.
# Les prix sont plafonnés à 64 émeraudes (une pile) par échange.

prefix: "&6[VÆLORIA] &7"

# Remplace TOUS les livres enchantés proposés par les bibliothécaires (spawn naturel, montée de niveau,
# changement de pupitre) par la table ci-dessous. false = seuls les boosts utilisent la table.
replace-vanilla-books: true

# Un livre vierge est demandé en plus des émeraudes (comme en vanilla).
require-book: true

# Un bibliothécaire qui propose un livre garde son métier : casser son pupitre ne relance plus son livre
# gratuitement. Pour changer son livre : le booster (payant) ou le capturer et le relâcher.
lock-librarians: true

# ── Boost (accroupi + clic droit sur un bibliothécaire, émeraudes en main) ─────────────────────────────
# Chaque boost relance le livre du villageois et augmente sa CHANCE de 1 (jusqu'à max-luck).
# Coût du n-ième boost : base + step × (n - 1), plafonné à max. Les boosts se cumulent par villageois.
boost:
  cost-base: 2
  cost-step: 1
  cost-max: 6
  max-luck: 15
  # Quand un livre de ces raretés sort, la chance et le coût du boost repartent de zéro.
  reset-on: [LEGENDAIRE]

# Effet de la chance : poids effectif = poids × (1 + chance × facteur de la rareté).
luck-factor:
  COMMUN: 0
  RARE: 0.15
  EPIQUE: 1.0
  LEGENDAIRE: 1.0

# Expérience donnée au villageois à chaque achat, par rareté.
villager-xp:
  COMMUN: 5
  RARE: 10
  EPIQUE: 20
  LEGENDAIRE: 30

# ── Capture à l'œuf ────────────────────────────────────────────────────────────────────────────────────
# Lancer un « Œuf de capture » sur un villageois le transforme en œuf à relâcher ailleurs (clic droit sur un bloc).
# Un villageois relâché repart au niveau 1, SANS livre, et ne pourra plus jamais proposer les livres qu'il avait :
# il faut le booster pour lui en faire proposer un nouveau.
capture:
  # Prix de l'œuf de capture (/echanges oeuf). 0 = non vendu (seulement /echanges give).
  egg-price: 24
  # Un simple œuf de poule capture aussi (déconseillé : captures accidentelles).
  plain-eggs: false
  # Refuse la capture si un plugin de protection (claims de faction…) interdit de frapper ce villageois.
  respect-protections: true
  # Nombre maximal de livres « interdits » mémorisés par villageois.
  max-forbidden: 12

# ── Table des livres ───────────────────────────────────────────────────────────────────────────────────
# enchant : identifiant Minecraft (protection, sharpness, efficiency, mending…), level : niveau,
# tier : COMMUN / RARE / EPIQUE / LEGENDAIRE, weight : poids à chance 0, price : [min, max] émeraudes,
# uses : achats possibles avant que l'offre ne s'épuise (le villageois la recharge à son poste, comme en vanilla).
# Poids totaux à chance 0 : commun 716, rare 230, épique 49, légendaire 5 (sur 1 000).
# Simulation (docs/ECHANGES.md) : Protection IV demande en moyenne 15 boosts ≈ 77 émeraudes, puis ~40 pour l'acheter.
books:
  # Commun — 71,6 %
  - { enchant: protection,            level: 2, tier: COMMUN, weight: 100, price: [8, 12],  uses: 12 }
  - { enchant: efficiency,            level: 3, tier: COMMUN, weight: 100, price: [8, 12],  uses: 12 }
  - { enchant: unbreaking,            level: 2, tier: COMMUN, weight: 100, price: [8, 12],  uses: 12 }
  - { enchant: sharpness,             level: 3, tier: COMMUN, weight: 100, price: [10, 14], uses: 12 }
  - { enchant: power,                 level: 3, tier: COMMUN, weight: 80,  price: [10, 14], uses: 12 }
  - { enchant: feather_falling,       level: 3, tier: COMMUN, weight: 80,  price: [8, 12],  uses: 12 }
  - { enchant: fire_protection,       level: 3, tier: COMMUN, weight: 60,  price: [6, 10],  uses: 12 }
  - { enchant: projectile_protection, level: 3, tier: COMMUN, weight: 60,  price: [6, 10],  uses: 12 }
  - { enchant: knockback,             level: 1, tier: COMMUN, weight: 36,  price: [6, 8],   uses: 12 }
  # Rare — 23 %
  - { enchant: protection,            level: 3, tier: RARE, weight: 40, price: [16, 22], uses: 6 }
  - { enchant: sharpness,             level: 4, tier: RARE, weight: 30, price: [18, 24], uses: 6 }
  - { enchant: efficiency,            level: 4, tier: RARE, weight: 30, price: [16, 22], uses: 6 }
  - { enchant: unbreaking,            level: 3, tier: RARE, weight: 30, price: [18, 24], uses: 6 }
  - { enchant: feather_falling,       level: 4, tier: RARE, weight: 25, price: [14, 20], uses: 6 }
  - { enchant: fortune,               level: 2, tier: RARE, weight: 20, price: [18, 24], uses: 6 }
  - { enchant: looting,               level: 2, tier: RARE, weight: 20, price: [18, 24], uses: 6 }
  - { enchant: silk_touch,            level: 1, tier: RARE, weight: 20, price: [22, 26], uses: 6 }
  - { enchant: power,                 level: 4, tier: RARE, weight: 15, price: [16, 22], uses: 6 }
  # Épique — 4,9 %
  - { enchant: protection,            level: 4, tier: EPIQUE, weight: 14, price: [36, 44], uses: 3 }
  - { enchant: sharpness,             level: 5, tier: EPIQUE, weight: 7,  price: [40, 48], uses: 3 }
