# VaeloriaJobs — métiers et arbres de protection.
# Après modification : /metiers reload (les bonus de tous les joueurs connectés sont recalculés).
#
# Règle de conception : tout bonus est VANILLA. Un nœud ne donne que :
#   - un modificateur d'attribut Minecraft (même effet que la commande /attribute) ;
#   - un effet de potion permanent vanilla.
# Pas d'objet custom, pas de double drop, pas de dégâts inventés.
#
# Attention PvP : VaeloriaCombat ignore la résistance au recul (ignore-knockback-resistance: true),
# donc « knockback_resistance » n'aurait aucun effet en combat. Les arbres utilisent à la place
# « explosion_knockback_resistance » (souffle de TNT/creepers, utile en raid).

progression:
  # XP pour passer du niveau n-1 au niveau n = base × n^exposant (arrondi).
  # base 20, exposant 1.5, niveau 30 : niveau 10 ≈ 2 900 XP, niveau 20 ≈ 14 600 XP, niveau 30 ≈ 41 000 XP.
  base: 20
  exponent: 1.5
  max-level: 30
  # Points de compétence gagnés par niveau. 30 niveaux × 1 point = 30 points = coût total de chaque arbre.
  points-per-level: 1
  # Réinitialiser un arbre (tous les points rendus, XP conservée) : délai en heures entre deux réinitialisations.
  reset-cooldown-hours: 24
  # Message « +2,5 XP Mineur » dans la barre d'action à chaque gain.
  action-bar: true
  # Niveaux annoncés à tout le serveur.
  announce-levels: [10, 20, 30]

anti-abuse:
  # Les blocs posés par un joueur (ou formés par lave + eau, ou poussés par un piston) ne donnent pas d'XP.
  ignore-placed-blocks: true
  # Multiplicateur d'XP des monstres de spawner (fermes à mobs). 0 = aucune XP.
  spawner-multiplier: 0.25
  # Pas d'XP en créatif.
  ignore-creative: true

effects:
  # Mondes où les bonus des arbres s'appliquent. Vide = partout.
  # Exemple pour couper les bonus en arène : [world, world_nether, world_the_end]
  worlds: []

