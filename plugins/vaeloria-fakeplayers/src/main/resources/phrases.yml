# Événements et situations.
events:
  join: ["slt", "salut", "yo", "cc", "re", "bonjour", "slt tlm", "re tlm", "wesh", "hello", "rere", "slt ça va ?"]
  leave: ["a+", "bon j'y vais", "a demain", "bye", "jdois y aller", "allez a+ tlm", "ciao", "jdeco", "a toute"]
  leave-night: ["bn", "bonne nuit", "bonne nuit tlm", "bon dodo", "a demain bn", "jvais dormir", "allez bn"]
  leave-meal: ["jvais manger", "a+ jvais manger", "afk manger", "jreviens après manger"]
  greet-real: ["slt {player}", "yo {player}", "cc {player}", "re {player}", "wb {player}", "slt", "yo"]
  welcome-new: ["bienvenue {player}", "bienvenue !", "wlc {player}", "bienvenue sur le serv", "slt {player} bienvenue"]
  death: ["rip {player}", "f", "rip", "{laugh}", "aïe", "gg {killer}", "rip {player} {laugh}", "il s'est fait détruire"]
  # Un vrai joueur frappe le corps d'un faux joueur au spawn (zone sans PvP).
  hit: ["?", "eh", "arrête", "pk tu me tapes", "stp", "ça sert à rien c'est la safe zone {laugh}", "oh calme",
        "t'es sérieux {player}", "viens en warzone si t'es chaud", "{laugh}", "tu fais quoi là", "aïe {laugh}",
        "1v1 en warzone {player}", "lâche moi", "jsuis afk", "quoi"]
  # Retour d'AFK au spawn, après qu'un vrai joueur lui a parlé, écrit en privé ou l'a frappé.
  afk-back-pinged: ["dsl j'étais afk", "dsl j'étais afk {player}", "re, j'étais afk", "pardon j'étais pas là {player}",
                    "oui ? j'étais afk", "re dsl {player}", "jsuis là, tu voulais quoi {player} ?", "dsl j'étais parti manger"]
  # Retour d'AFK sans que personne ne l'ait sollicité (pas toujours : la plupart ne disent rien).
  afk-back: ["re", "rere", "me revoilà", "re tlm", "bon", "j'étais afk mdr"]
  # Un vrai joueur écrit le pseudo d'un faux joueur sans autre intention reconnue.
  named: ["?", "oui ?", "quoi", "ouais ?", "jsuis là", "hein ?", "qu'est-ce qu'il y a ?", "moi ?"]
  # Suite d'une conversation déjà engagée avec un vrai joueur, sans intention reconnue.
  continue: ["ah ouais", "grave", "{laugh}", "ok", "jsp", "c'est vrai", "sérieux ?", "ah bon", "trop bien",
             "ouais", "bof", "pas faux", "ça marche", "jsuis d'accord", "nn quand même pas"]
  # Messages privés reçus, sans intention reconnue.
  whisper: ["?", "oui ?", "c'est qui ?", "jsuis occupé là", "plus tard", "quoi ?", "ok", "nn dsl", "jsuis afk",
            "{laugh}", "tkt", "jsp", "pk ?", "ouais", "attends 2 sec", "jsuis en pvp là", "on se connaît ?",
            "jte réponds après", "ça dépend"]
