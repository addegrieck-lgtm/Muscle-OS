# VæloriaFakePlayers — banque de phrases des faux joueurs
#
# Modèles : {mot} = un mot au hasard de « vocab », {a|b|c} = une des variantes, {n:2-64} = un nombre,
# {player} = le vrai joueur concerné, {killer} = son tueur (événement death).
# {~mot} : remplissage (« bon », « mdr »…) ignoré par l'anti-répétition : une phrase n'est « nouvelle » que si son
# contenu change. Aucune phrase ne sort deux fois (mémoire permanente seen.dat, voir chat.memory dans config.yml).
# Le style (abréviations, accents, fautes, « mdr »…) est ajouté automatiquement selon chaque faux joueur :
# écris les phrases simplement, en minuscules.
# Apprentissage : les phrases qui font réagir les vrais joueurs reviennent plus souvent (fichier brain.yml).
# Après modification : /fp reload.

vocab:
  # --- Remplissage : ces mots varient la phrase mais ne la rendent pas « nouvelle » (ils sont ignorés pour
  # l'anti-répétition) : on les utilise avec un ~ devant, ex. {~o}. ---
  o: ["", "", "", "", "", "bon ", "wsh ", "sinon ", "du coup ", "frr ", "eh ", "ptn ", "bref ", "au fait ", "sah ",
      "franchement ", "jsp mais ", "les gars ", "tlm ", "attendez ", "ah et ", "bon bah ", "genre ", "ok "]
  c: ["", "", "", "", "", "", " mdr", " ptdr", " xD", " lol", " jpp", " :)", " frr", " sah", " en vrai", " tkt",
      " hein", " quoi", " bref", " wsh", " oklm", " ahah", " mdrr"]
  # --- Contenu ---
  item: ["diams", "des diamants", "du fer", "de la netherite", "des pommes en or", "des pommes de notch", "des perles",
         "des ender pearls", "de l'obsi", "des bouteilles d'xp", "des potions de force", "des splash heal", "des totems",
         "une sharp 5", "une épée en diams", "un stuff full diams", "un stuff en netherite", "un arc power 5", "de la tnt",
         "de la redstone", "des émeraudes", "un spawner", "des blaze rods", "des livres enchantés", "des shulkers",
         "du lapis", "de l'or", "des lingots de netherite", "des fragments antiques", "des carottes dorées",
         "du bois", "de la pierre", "du sable", "des enchant protection 4", "une pioche efficacité 5", "des elytras",
         "un trident", "des têtes de wither", "des étoiles du nether", "des bûches", "du quartz", "des glowstone"]
  item_short: ["diams", "fer", "netherite", "pommes", "perles", "obsi", "xp", "potions", "totems", "tnt", "spawners",
               "émeraudes", "shulkers", "livres", "lapis", "or", "quartz", "blaze rods", "bûches", "redstone"]
  tier: ["fer", "diams", "netherite", "cuir", "maille", "or"]
  qty: ["{n:2-64}", "{n:2-9} stacks de", "un stack de", "{n:2-5} shulkers de", "genre {n:10-300}", "une dizaine de",
        "une trentaine de", "plein de"]
  price: ["{n:1-50}k", "{n:100-950}$", "{n:1-9}k chacun", "pas cher", "un bon prix", "{n:2-20}k le stack",
          "moitié prix", "{n:5-90}k les {n:2-10}"]
  place: ["au spawn", "au nether", "à l'end", "en warzone", "au koth", "à ma base", "en bordure", "au marché",
          "dans les mines", "près du spawn", "loin du spawn", "en zone pvp", "vers les {n:2-20}k", "dans le désert",
          "dans la jungle", "près de l'arène", "à la porte de guerre", "sur l'île", "dans une grotte", "près d'un village",
          "dans la toundra", "au fond d'un ravin", "vers le nord", "vers le sud", "à l'est", "à l'ouest",
          "dans la mesa", "près de l'océan", "dans les montagnes", "dans la forêt sombre"]
  when: ["ce soir", "demain", "tout à l'heure", "dans 10 min", "après manger", "ce week-end", "dans 1h", "plus tard",
         "dans 20 min", "vers {n:18-23}h", "demain soir", "samedi", "dimanche", "mercredi aprem", "après les cours",
         "dans 2 min", "quand je reviens", "cette nuit"]
  time_ago: ["tout à l'heure", "hier", "y a 5 min", "ce matin", "y a 2 jours", "y a {n:2-50} min", "hier soir",
             "cette nuit", "la semaine dernière", "avant-hier", "y a une heure", "à l'instant"]
  bigfac: ["une grosse fac", "la fac du top 1", "une fac du top", "des mecs d'une grosse fac", "une fac de tryhard",
           "une fac de {n:8-20}", "une team de tryhard", "des mecs full netherite"]
  mob: ["creeper", "blaze", "enderman", "wither squelette", "zombie", "warden", "ghast", "piglin", "squelette",
        "araignée", "sorcière", "phantom", "drowned", "guardian", "slime", "magma cube", "hoglin", "pillard"]
  structure: ["un donjon", "un temple", "une forteresse", "un bastion", "une mineshaft", "une ville de l'end",
              "un manoir", "un monument", "un ancient city", "un portail en ruine", "un avant-poste de pillards",
              "un village", "une épave", "un igloo", "un trial chamber"]
  feeling: ["chaud", "trop chaud", "grave chaud", "motivé", "chaud patate", "dispo", "partant", "bouillant"]
  good: ["trop bien", "incroyable", "le feu", "trop stylé", "vraiment bien", "masterclass", "propre", "lourd",
         "trop fort", "magnifique", "parfait", "bien pensé", "pas mal du tout"]
  bad: ["abusé", "trop cheat", "fumé", "pas normal", "op", "n'importe quoi", "relou", "chiant", "nul", "trop dur",
        "cassé", "pété"]
  laugh: ["mdr", "ptdr", "xD", "lol", "jpp", "mdrr", "ahah"]
  friend: ["mon pote", "mon frère", "mon mate", "le reuf", "un pote", "mon cousin", "mon pote de classe", "un collègue"]
  duration: ["{n:2-59} min", "{n:2-6}h", "une heure", "toute la soirée", "depuis ce matin", "{n:2-12} jours"]
  activity: ["miner", "farmer", "construire", "pvp", "explorer", "faire de l'xp", "trader", "chercher des diams",
             "faire ma base", "faire une ferme", "chercher un bastion", "farmer les blazes", "faire des potions",
             "enchanter mon stuff", "chercher des spawners", "farmer l'or au nether", "afk farm"]
  verb_done: ["trouvé", "fini", "réparé", "perdu", "récupéré", "enchanté", "craft", "vendu", "acheté"]
  body: ["la lave", "le vide", "un trou", "l'eau", "un cactus", "une falaise", "un piège", "du sable mouvant"]
  base_part: ["les murs", "la ferme", "le stuff room", "la tour", "les pièges", "le portail", "la cave", "le toit",
              "le bunker", "les remparts", "la salle des coffres", "l'entrée", "les tunnels", "la serre"]
  mate: ["mon mate", "mon pote", "un pote", "mon reuf", "un gars de ma team"]
  emote_reac: ["ouf", "aïe", "rip", "gg", "nice", "chaud", "trop bien", "la honte", "dommage", "enfin"]

# Sujets des messages spontanés. weight = fréquence relative ; hours = heures où le sujet existe (vide = toujours).
# Les sujets favoris de chaque faux joueur (pvp, faction, trade, farm, server, fun, build) sortent 2,5× plus.
# Chaque phrase ne sort qu'UNE fois (mémoire permanente, seen.dat) : plus il y a d'emplacements, plus il y a de phrases.
