# Petites conversations entre faux joueurs : l'un pose la question, un autre répond, parfois le premier relance.
threads:
  - ask: ["le koth c'est quand ?", "y a koth ce soir ?", "il est à quelle heure le koth"]
    answers: ["{when} je crois", "regarde sur le discord", "à 21h normalement", "jsp demande au staff", "ce soir oui"]
    follow-ups: ["merci", "ok", "ah cool", "parfait"]
  - ask: ["qqn a {item} à vendre ?", "jcherche {item}"]
    answers: ["moi j'en ai, mp", "combien tu payes ?", "regarde au shop", "nn dsl", "j'en ai plus"]
    follow-ups: ["je mp", "ok je regarde", "dommage"]
  - ask: ["qqn pour un 1v1 ?", "qui veut pvp ?", "1v1 {place} ?"]
    answers: ["moi", "go", "jsuis pas stuff là", "après si tu veux", "tu vas perdre {laugh}", "où ?"]
    follow-ups: ["go {place}", "viens", "ok à toute", "flemme en fait"]
  - ask: ["vous êtes dans quelle fac ?", "c'est quoi la meilleure fac ?"]
    answers: ["les {fac}", "chez les {fac}", "jsuis sans fac", "les {fac} évidemment", "la mienne {laugh}"]
    follow-ups: ["ah ok", "ils recrutent ?", "jamais entendu"]
  - ask: ["c'est quoi le meilleur grade ?", "le grade vaut le coup ?"]
    answers: ["le plus cher {laugh}", "regarde sur le site", "le vaelorian il est bien", "ça dépend ce que tu veux"]
    follow-ups: ["ok merci", "trop cher pour moi"]
  - ask: ["qqn sait comment faire de l'argent vite ?", "comment vous faites de l'argent ?"]
    answers: ["farm les spawners", "vends tes diams", "les jobs", "le koth rapporte bien", "mine et vends au shop"]
    follow-ups: ["merci", "ok je vais essayer"]
  - ask: ["le serv lag ou c'est moi ?", "vous laggez ?"]
    answers: ["c'est toi", "un peu oui", "chez moi ça va", "redémarre ton jeu", "ça va pour moi"]
    follow-ups: ["ok c'est mon co", "bizarre"]
  - ask: ["qqn a une ferme à xp ?", "où on farm l'xp ?"]
    answers: ["moi mais c'est privé {laugh}", "les spawners à blaze", "au nether", "fais une ferme à {mob}"]
    follow-ups: ["merci", "ok"]
  - ask: ["qui a raid les {fac} ?", "c'est qui qui a raid ma base ?"]
    answers: ["jsp", "pas moi {laugh}", "sûrement les {fac}", "check les logs", "aucune idée"]
    follow-ups: ["ils vont voir", "sérieux", "on va se venger"]
  - ask: ["jsuis nouveau, je fais quoi ?", "vous conseillez quoi pour commencer ?"]
    answers: ["trouve une fac", "farm un peu de stuff d'abord", "va loin du spawn", "lis les règles sur le site",
              "rejoins le discord"]
    follow-ups: ["merci", "ok ça marche", "trop gentil"]
  - ask: ["vous jouez depuis quand ?", "qui est là depuis le début ?"]
    answers: ["depuis l'ouverture", "{n:2-11} mois", "une semaine", "moi depuis le début {laugh}"]
    follow-ups: ["ah ouais quand même", "pareil"]
  - ask: ["qqn a vu {friend} ?", "{friend} est co ?"]
    answers: ["nn", "il était là {time_ago}", "jsp", "il est afk je crois"]
    follow-ups: ["ok merci", "ah"]

# Réponses aux messages des VRAIS joueurs. Ordre important : la première intention reconnue gagne.
# chance = probabilité qu'un faux joueur réponde (multipliée par chat.replies.chance dans config.yml).
intents:
  # Question sur les bots : les faux joueurs ne répondent pas (ni oui ni non).
  bot:
    chance: 0
    keywords: ["bot", "bots", "faux joueur", "faux joueurs", "fake", "robot", "ia", "pnj"]
    replies: []
  insult:
    chance: 0.3
    keywords: ["fdp", "ntm", "tg", "ta gueule", "connard", "nul", "nullos", "bouffon", "noob", "ez", "ratio"]
    replies: ["calme toi", "ok", "t'es vexé ?", "{laugh}", "ça va tranquille", "détends toi", "bref"]
  greeting:
    chance: 0.45
    keywords: ["salut", "slt", "bonjour", "bjr", "cc", "coucou", "yo", "hello", "wesh", "hey", "bonsoir", "salut tlm"]
    replies: ["slt", "yo", "cc", "salut {player}", "slt ça va ?", "yo {player}", "bonjour", "wesh", "hey", "cc {player}"]
  how:
    chance: 0.4
    keywords: ["ca va", "cv", "sa va", "la forme", "quoi de neuf", "tu vas bien", "vous allez bien"]
    replies: ["oui et toi ?", "tranquille", "ça va et toi", "bien bien", "tkt ça va", "ça va, un peu fatigué",
              "nickel", "ça peut aller"]
  thanks:
    chance: 0.3
    keywords: ["merci", "mrc", "thx", "merci beaucoup", "trop gentil"]
    replies: ["de rien", "tkt", "np", "avec plaisir", "pas de souci"]
  bye:
    chance: 0.4
    keywords: ["bye", "ciao", "a demain", "a plus", "bonne nuit", "bn", "je vais dormir", "jvais dormir", "je deco",
               "jdeco", "bonne soiree"]
    replies: ["bye", "a+", "bn", "bonne nuit {player}", "a demain", "ciao", "a+ {player}"]
  back:
    chance: 0.35
    keywords: ["re", "rere", "me revoila", "je suis de retour"]
    replies: ["wb", "re", "wb {player}", "rere"]
  gg:
    chance: 0.45
    keywords: ["gg", "bien joue", "gg wp", "bravo", "trop fort"]
    replies: ["gg", "gg wp", "ggg", "bien joué", "gg {player}", "propre"]
  koth:
    chance: 0.5
    keywords: ["koth"]
    replies: ["{when} je crois", "regarde le discord", "jsp", "ouais jsuis chaud", "ça va être {feeling}",
              "à 21h normalement", "les {fac} vont le prendre comme d'hab"]
  event:
    chance: 0.4
    keywords: ["event", "evenement", "tournoi", "concours"]
    replies: ["{when} je crois", "jsp regarde le discord", "y en a un ce week-end non ?", "j'espère qu'il y en a un"]
  recruit:
    chance: 0.4
    keywords: ["recrute", "recrutement", "cherche une fac", "cherche fac", "rejoindre", "une fac", "ma fac",
               "notre fac", "team"]
    replies: ["moi jsuis déjà dans une fac", "vous êtes combien ?", "c'est quoi ta fac ?", "les {fac} recrutent je crois",
              "mp moi", "vous êtes actifs ?", "jsuis chaud mp"]
  which-fac:
    chance: 0.45
    keywords: ["quelle fac", "quelle faction", "dans quelle fac", "t'es dans quelle fac", "ta fac", "ta faction"]
    replies: ["les {fac}", "chez les {fac}", "jsuis sans fac pour l'instant", "les {fac} et toi ?",
              "jsuis chez les {fac} depuis {n:2-8} semaines", "une petite fac, les {fac}"]
  trade:
