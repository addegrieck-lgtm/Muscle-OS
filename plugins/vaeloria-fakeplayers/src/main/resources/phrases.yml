# Petites conversations entre faux joueurs : l'un pose la question, un autre répond, parfois le premier relance.
threads:
  - ask: ["{~o}le koth c'est quand {when} ?{~c}", "{~o}y a koth {when} ? je veux venir avec {mate}{~c}",
          "{~o}il est à quelle heure le koth {when}, je suis {place}{~c}"]
    answers: ["{~o}{when} je crois{~c}", "{~o}regarde sur le discord, c'est marqué {when}{~c}", "{~o}vers {n:19-22}h normalement{~c}",
              "{~o}jsp, demande au staff{~c}", "{~o}{when} oui, {bigfac} sera là{~c}"]
    follow-ups: ["{~o}merci{~c}", "{~o}ok{~c}", "{~o}ah cool, je ramène {mate}{~c}", "{~o}parfait, je prépare mes {item_short}{~c}"]
  - ask: ["{~o}qqn a {item} à vendre ?{~c}", "{~o}jcherche {qty} {item_short}, qui en a ?{~c}", "{~o}qui me vend {item} {price} ?{~c}"]
    answers: ["{~o}moi j'en ai {qty}, mp{~c}", "{~o}combien tu payes ? {price} ça te va ?{~c}", "{~o}regarde au shop, {price} je crois{~c}",
              "{~o}nn dsl, j'en ai plus depuis {time_ago}{~c}", "{~o}j'en ai {place}, viens{~c}"]
    follow-ups: ["{~o}je mp{~c}", "{~o}ok je regarde{~c}", "{~o}dommage{~c}", "{~o}{price} c'est trop cher{~c}", "{~o}j'arrive {place}{~c}"]
