name: VaeloriaFakePlayers
version: '${version}'
main: fr.vaeloria.fakeplayers.FakePlayersPlugin
api-version: '1.21'
description: Faux joueurs (TAB, compteur, chat, corps mannequin) pour animer et tester le serveur VÆLORIA.
authors: [VÆLORIA]
softdepend: [packetevents]
commands:
  fakeplayers:
    description: Gestion des faux joueurs
    aliases: [fp, fakeplayer]
    permission: vaeloria.fakeplayers.admin
permissions:
  vaeloria.fakeplayers.admin:
    default: op
