# VæloriaRTP — réglages généraux. Les mondes se configurent dans worlds.yml ou en jeu avec /rtpadmin.
# Textes au format MiniMessage : https://docs.advntr.dev/minimessage/format.html

menu:
  rows: 3                       # hauteur du menu /rtp (1 à 6)
  filler: BLACK_STAINED_GLASS_PANE
  hide-locked-worlds: false     # true = cacher les mondes dont le joueur n'a pas la permission

teleport:
  cooldown-per-world: true      # false = un seul délai partagé entre tous les mondes
  cancel-on-move: true          # bouger pendant le compte à rebours annule le RTP
  cancel-on-damage: true        # subir des dégâts pendant le compte à rebours annule le RTP
  fall-protection-seconds: 5    # pas de dégâts de chute juste après l'arrivée
  title: true                   # titre à l'écran à l'arrivée

search:
  max-attempts: 25              # positions testées avant d'abandonner
  unsafe-blocks:                # sol ou blocs interdits à l'arrivée
    - LAVA
    - WATER
    - MAGMA_BLOCK
    - CACTUS
    - FIRE
    - SOUL_FIRE
    - CAMPFIRE
    - SOUL_CAMPFIRE
    - POWDER_SNOW
    - SWEET_BERRY_BUSH
    - POINTED_DRIPSTONE
    - WITHER_ROSE
    - COBWEB
    - BEDROCK
  blocked-biomes:               # biomes où l'on n'atterrit jamais
    - ocean
    - deep_ocean
    - cold_ocean
    - deep_cold_ocean
    - frozen_ocean
    - deep_frozen_ocean
    - lukewarm_ocean
    - deep_lukewarm_ocean
    - warm_ocean
    - river
    - frozen_river

# Portails : zone sélectionnée avec la hache (/rtpadmin wand), qui téléporte quand on y entre.
portals:
  wand-material: GOLDEN_AXE
  max-volume: 10000             # blocs max par portail (garde-fou contre un coin oublié) ; /rtpadmin portal maxvolume <n>
  particle-interval-ticks: 4    # fréquence d'animation (20 ticks = 1 s)
  density: 0.4                  # particules par bloc de zone à chaque animation
  max-particles-per-portal: 60  # plafond par portail et par animation
  view-distance: 48             # animation seulement si un joueur est à moins de 48 blocs
  ambient-sound: true           # bourdonnement discret de portail
  default-style: vaeloria
  # Styles de particules. DUST (couleur) et DUST_COLOR_TRANSITION (from → to) acceptent n'importe
  # quelle couleur hexadécimale ; les autres particules sont celles du jeu (PORTAL, END_ROD…).
  # weight = proportion de cette couche dans le mélange.
  styles:
    vaeloria:
      display-name: "<#D21F2F>Rouge Væloria"
      icon: RED_STAINED_GLASS
      layers:
        - {particle: DUST_COLOR_TRANSITION, from: "#D21F2F", to: "#5E0710", size: 1.4, weight: 6}
        - {particle: DUST, color: "#FFFFFF", size: 0.6, weight: 1}
        - {particle: CRIMSON_SPORE, weight: 2}
    sang:
      display-name: "<dark_red>Sang & braises"
      icon: REDSTONE_BLOCK
      layers:
        - {particle: DUST, color: "#8B0000", size: 1.6, weight: 5}
        - {particle: FLAME, weight: 1}
        - {particle: LAVA, weight: 1}
    ame:
      display-name: "<aqua>Âmes bleues"
      icon: SOUL_LANTERN
      layers:
        - {particle: DUST_COLOR_TRANSITION, from: "#3AD1E6", to: "#0B3D91", size: 1.3, weight: 5}
        - {particle: SOUL_FIRE_FLAME, weight: 2}
        - {particle: SCULK_SOUL, weight: 1}
    neant:
      display-name: "<dark_purple>Néant"
      icon: CRYING_OBSIDIAN
      layers:
        - {particle: DUST_COLOR_TRANSITION, from: "#7A2BD6", to: "#07070A", size: 1.5, weight: 5}
        - {particle: REVERSE_PORTAL, weight: 3}
        - {particle: END_ROD, weight: 1}
    royal:
      display-name: "<gold>Or royal"
      icon: GOLD_BLOCK
      layers:
        - {particle: DUST_COLOR_TRANSITION, from: "#F5C542", to: "#A96E00", size: 1.3, weight: 5}
        - {particle: WAX_ON, weight: 2}
        - {particle: END_ROD, weight: 1}
    nature:
      display-name: "<green>Émeraude"
      icon: EMERALD_BLOCK
      layers:
        - {particle: DUST, color: "#2ECC71", size: 1.3, weight: 5}
        - {particle: HAPPY_VILLAGER, weight: 1}
        - {particle: CHERRY_LEAVES, weight: 1}
    ombre:
      display-name: "<gray>Ombre"
      icon: BLACKSTONE
      layers:
        - {particle: DUST_COLOR_TRANSITION, from: "#2A0A0E", to: "#000000", size: 1.6, weight: 5}
        - {particle: SMOKE, weight: 2}
        - {particle: ASH, weight: 2}

