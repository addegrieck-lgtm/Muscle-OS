name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaeloria
          POSTGRES_PASSWORD: vaeloria
          POSTGRES_DB: vaeloria_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaeloria" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://vaeloria:vaeloria@localhost:5432/vaeloria_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @vaeloria/api build
      # Le site se construit sans API joignable : chaque page doit dégrader proprement.
      - run: pnpm --filter @vaeloria/web build
        env:
          API_URL: http://127.0.0.1:9
      - run: pnpm --filter @vaeloria/admin build

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/vaeloria-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vaeloria-bridge
          path: plugins/vaeloria-bridge/build/libs/*.jar

  factions-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/vaeloria-factions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vaeloria-factions
          path: plugins/vaeloria-factions/build/libs/*.jar
