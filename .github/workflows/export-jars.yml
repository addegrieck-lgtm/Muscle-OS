# Temporaire : compile les plugins et pousse les jars dans une référence git cachée pour les récupérer.
name: Export jars (temporaire)
on:
  push:
    branches: [claude/nice-hamilton-4f4v4b]
    paths: [.github/workflows/export-jars.yml]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: |
          mkdir -p /tmp/out
          for p in staff crates vote combat arena bridge; do
            (cd plugins/vaeloria-$p && gradle build -x test --no-daemon -q) && cp plugins/vaeloria-$p/build/libs/*.jar /tmp/out/
          done
          ls -la /tmp/out
      - run: |
          cd /tmp/out
          git init -q && git checkout -q -b jars
          git -c user.name=ci -c user.email=ci@localhost add . && git -c user.name=ci -c user.email=ci@localhost commit -qm jars
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/builds/vaeloria-jars
