# Aperçu statique du site sur GitHub Pages (https://addegrieck-lgtm.github.io/Muscle-OS/).
# Pas d'API ni de données en direct : version vitrine non indexée, en attendant l'hébergement réel.
# Réglage requis une fois : Settings → Pages → Source : « GitHub Actions ».
name: Aperçu GitHub Pages

on:
  push:
    branches: [main, claude/vaeloria-platform]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Base éphémère + API démarrées le temps du build : l'aperçu affiche le contenu de base
    # (FAQ, saison, article) et le catalogue D'EXEMPLE de la boutique. Aucune donnée réelle.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaeloria
          POSTGRES_PASSWORD: vaeloria
          POSTGRES_DB: vaeloria
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaeloria" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://vaeloria:vaeloria@localhost:5432/vaeloria
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contenu de base et catalogue d'exemple
        run: pnpm --filter @vaeloria/api db:seed
      - name: API temporaire pour le rendu statique
        run: |
          pnpm --filter @vaeloria/api build
          (cd apps/api && node dist/index.js > /tmp/api.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4000/health && break; sleep 1; done
      - run: pnpm --filter @vaeloria/web build:preview
        env:
          PREVIEW_BASE_PATH: /Muscle-OS
          NEXT_PUBLIC_SITE_URL: https://addegrieck-lgtm.github.io/Muscle-OS
          API_URL: http://127.0.0.1:4000
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  deploy:
    needs: build
    # Seule la branche main peut publier (règle de l'environnement github-pages) ;
    # sur les autres branches, le build sert de vérification.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
